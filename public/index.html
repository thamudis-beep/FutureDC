<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Future of the Data Center</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@1,8..60,400;1,8..60,600&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#090a0f; --bg2:#0c0e15;
    --ink:#e9ebf2; --ink-soft:#9297a8; --ink-dim:#5a6072;
    --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.055);
    --cream:#f2eee4; --cream-ink:#1b1e19; --cream-soft:#6c7266;
    --accent:#6f8dff; --glow:rgba(111,141,255,.42);
    --pre:#8b93a6; --today:#e0a355; --future:#57c7dd;
    --pwr:#e0a355; --cmp:#46c6dd; --dc:#6f8dff; --app:#ab7cf1;
    --serif:'Geist',system-ui,sans-serif;
    --fig:'Source Serif 4',Georgia,serif;
    --sans:'Geist',system-ui,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;font-family:var(--sans);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
  body{background:radial-gradient(60% 60% at 42% 44%, var(--glowbg,rgba(111,141,255,.10)), transparent 62%),radial-gradient(120% 120% at 50% -8%, rgba(255,255,255,.03), transparent 46%),var(--bg);transition:background 1s ease}
  #field{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;image-rendering:pixelated;image-rendering:crisp-edges}
  .led{position:fixed;inset:0;z-index:2;pointer-events:none;
    background-image:repeating-linear-gradient(0deg,rgba(4,5,9,.62) 0 1px,transparent 1px 8px),repeating-linear-gradient(90deg,rgba(4,5,9,.62) 0 1px,transparent 1px 8px)}
  /* tracking reticles — locked to the field's own features, home only, so they
     never sit under a panel of content */
  .hud{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity 1.1s ease}
  .hud.on{opacity:.78}
  .trk{position:absolute;width:44px;height:44px;transform:translate(-50%,-50%);color:var(--tc)}
  .trk i{position:absolute;width:11px;height:11px;border:1px solid currentColor;opacity:.9}
  .trk i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}
  .trk i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}
  .trk i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}
  .trk i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}
  .trk b{position:absolute;left:50%;bottom:calc(100% + 7px);transform:translateX(-50%);white-space:nowrap;
    font:500 9.5px var(--mono);letter-spacing:.09em;font-variant-numeric:tabular-nums}
  .vfind i{position:absolute;width:26px;height:26px;border:1px solid rgba(255,255,255,.16)}
  .vfind i:nth-child(1){left:26px;top:74px;border-right:0;border-bottom:0}
  .vfind i:nth-child(2){right:26px;top:74px;border-left:0;border-bottom:0}
  .vfind i:nth-child(3){left:26px;bottom:30px;border-right:0;border-top:0}
  .vfind i:nth-child(4){right:26px;bottom:30px;border-left:0;border-top:0}
  .vig{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(120% 90% at 50% 42%, transparent 54%, rgba(0,0,0,.5))}

  .bar{position:fixed;top:0;left:0;right:0;height:58px;z-index:40;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(20px,4vw,52px)}
  .brand{display:flex;align-items:center;gap:10px;cursor:pointer}
  .brand .dia{width:9px;height:9px;background:var(--accent);transform:rotate(45deg);border-radius:1px;transition:background .6s}
  .brand b{font:600 12.5px var(--mono);letter-spacing:.02em}
  .topnav{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;padding:5px;border-radius:999px;
    background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));backdrop-filter:blur(16px);
    border:1px solid rgba(255,255,255,.1);box-shadow:0 12px 34px -14px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.08)}
  .topnav .slider{position:absolute;left:0;top:5px;bottom:5px;border-radius:999px;background:linear-gradient(180deg,#fff,#e7eaf1);
    box-shadow:0 4px 14px -4px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.7);transition:transform .42s cubic-bezier(.5,.05,.15,1),width .42s cubic-bezier(.5,.05,.15,1);z-index:0}
  .topnav a{position:relative;z-index:1;padding:8px 17px;border-radius:999px;font:500 12px var(--mono);letter-spacing:.03em;color:var(--ink-soft);cursor:pointer;transition:color .3s;white-space:nowrap}
  .topnav a.on{color:#0a0c12}
  .topnav a:not(.on):hover{color:var(--ink)}

  .view{position:fixed;inset:58px clamp(20px,4vw,52px) 26px;z-index:5;opacity:0;visibility:hidden;transform:translateY(12px);transition:opacity .5s ease,transform .5s cubic-bezier(.2,.7,.2,1);pointer-events:none;display:flex;flex-direction:column}
  .view.on{opacity:1;visibility:visible;transform:none;pointer-events:auto}
  .vtitle{flex:none;padding-top:clamp(4px,1.4vh,18px)}
  .eyebrow{font:500 11.5px var(--mono);letter-spacing:.2em;color:var(--accent);transition:color .5s;margin-bottom:10px}
  h1{font-family:var(--serif);font-weight:700;font-size:clamp(34px,4.8vw,58px);line-height:.98;letter-spacing:-.02em;margin:0}

  /* ===== HOME (big immersive) ===== */
  #v-home{justify-content:center}
  #v-home .hhead{flex:none}
  #v-home .stagewrap{display:grid;grid-template-columns:minmax(320px,1fr) minmax(360px,1.05fr);gap:clamp(30px,6vw,110px);align-items:center;flex:1;min-height:0}
  .hleft{display:flex;flex-direction:column;justify-content:center}
  .cta{display:inline-flex;align-items:center;gap:12px;align-self:flex-start;margin-top:clamp(22px,4vh,46px);
    padding:13px 22px 13px 18px;border-radius:999px;cursor:pointer;font:500 13.5px var(--sans);color:var(--ink);
    background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.14);
    backdrop-filter:blur(14px);box-shadow:0 14px 40px -16px rgba(0,0,0,.8);transition:.25s}
  .cta:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.28);box-shadow:0 20px 50px -16px rgba(0,0,0,.9)}
  .cta .bars{display:flex;flex-direction:column;gap:2.5px}
  .cta .bars i{display:block;height:1.5px;background:var(--ink);border-radius:1px}
  .cta .bars i:nth-child(1){width:13px}.cta .bars i:nth-child(2){width:9px}.cta .bars i:nth-child(3){width:11px}
  .hright{position:relative;height:100%;min-height:0}
  .hcard.k1{left:0;top:8%}
  .hcard.k2{right:0;top:44%}
  #v-home h1{font-size:clamp(38px,5.2vw,76px);line-height:.94;letter-spacing:-.03em;font-weight:700;max-width:11ch}
  #v-home h1 .sub{display:block;font-style:italic;color:#cfd6ea;font-size:.62em;margin-top:.06em}
  #v-home .kick{font:500 12px var(--mono);letter-spacing:.28em;color:var(--accent);margin-bottom:20px;text-transform:uppercase}
  .cards{position:absolute;inset:0}
  .hcard{position:absolute;width:min(300px,52%);border-radius:20px;overflow:hidden;cursor:pointer;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.008));
    transition:transform .3s cubic-bezier(.2,.7,.2,1),border-color .3s,box-shadow .3s;box-shadow:0 30px 70px -40px rgba(0,0,0,.8)}
  .hcard:hover{transform:translateY(-6px);border-color:color-mix(in srgb,var(--ca) 60%,var(--line));box-shadow:0 46px 90px -40px rgba(0,0,0,.85),0 0 40px -20px var(--ca)}
  .hcard .pic{position:relative;height:clamp(108px,14vh,152px);overflow:hidden;background:radial-gradient(120% 120% at 50% 10%, color-mix(in srgb,var(--ca) 14%,#0b0d14), #0a0c12)}
  .hcard .pic::after{content:'';position:absolute;left:-20%;right:-20%;top:-45%;height:45%;background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--ca) 40%,transparent),transparent);animation:scan var(--sd,3.6s) cubic-bezier(.5,0,.5,1) infinite;pointer-events:none;mix-blend-mode:screen}
  @keyframes scan{0%{transform:translateY(0);opacity:0}12%{opacity:.9}48%{transform:translateY(560%);opacity:.9}62%{opacity:0}100%{transform:translateY(560%);opacity:0}}
  .hcard .meta{padding:12px 16px 14px;padding-right:62px}
  .hcard .no{font:600 10.5px var(--mono);letter-spacing:.16em;color:var(--ca)}
  .hcard h3{font-family:var(--serif);font-weight:600;font-size:clamp(21px,2.1vw,29px);line-height:1;letter-spacing:-.01em;margin:0;color:var(--ink)}
  .hcard .go{position:absolute;right:14px;bottom:13px;width:34px;height:34px;border-radius:50%;background:var(--ca);color:#0a0c12;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;transition:transform .25s}
  .hcard:hover .go{transform:translateX(4px)}
  .mini-shift,.mini-stack{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:9px 12px}
  .mini-shift>svg,.mini-stack>svg{width:100%;height:100%}

  /* ===== MATRIX (4 modules × time) ===== */
  #v-atlas .body{flex:1;min-height:0;display:flex;flex-direction:column;padding-top:clamp(8px,1.6vh,18px);overflow:hidden}
  .mtx{flex:1;min-height:0;display:grid;grid-template-columns:46px 208px 1fr 1fr 1fr;grid-auto-rows:min-content;
    align-content:center;overflow:auto;scrollbar-width:thin;background:linear-gradient(180deg,rgba(15,17,26,.94),rgba(10,12,19,.96));
    backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:18px;padding:clamp(8px,1.5vh,14px) 18px 8px;
    box-shadow:0 30px 80px -30px rgba(0,0,0,.9)}
  .mhead{padding:0 14px 10px;font:600 12px var(--mono);letter-spacing:.14em}
  .mhead .k{display:inline-block;padding-bottom:6px;border-bottom:2px solid transparent}
  .mhead.pre .k{color:var(--pre);border-color:var(--pre)}
  .mhead.today .k{color:var(--today);border-color:var(--today)}
  .mhead.future .k{color:var(--future);border-color:var(--future)}
  .mhead .yr{display:block;margin-top:4px;font:400 9.5px var(--mono);letter-spacing:.08em;color:var(--ink-dim)}
  /* the four layers: one block each, with a spine down its rows */
  .grp{grid-column:1;position:relative;display:flex;align-items:center;justify-content:center;padding:8px 4px 8px 10px;
    border-top:1px solid var(--line);cursor:pointer;transition:.2s}
  .grp.v .gname{writing-mode:vertical-rl;transform:rotate(180deg)}
  .grp .spine{position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:2px;background:var(--gc);opacity:.85}
  .grp .gname{font:700 10.5px/1.25 var(--mono);letter-spacing:.13em;color:var(--gc);text-align:center;white-space:nowrap}
  .grp:hover{background:color-mix(in srgb,var(--gc) 8%,transparent)}
  .rlabel{grid-column:2;padding:clamp(6px,1vh,9px) 14px clamp(6px,1vh,9px) 10px;border-top:1px solid var(--line2);display:flex;align-items:center;gap:10px;cursor:pointer;transition:.2s}
  .rlabel.gtop{border-top:1px solid var(--line)}
  .rlabel:hover .mn{color:var(--mc)}
  .rlabel .rno{width:26px;height:24px;flex:none;border-radius:7px;border:1px solid var(--mc);color:var(--mc);
    display:flex;align-items:center;justify-content:center;font:700 10.5px var(--mono);background:color-mix(in srgb,var(--mc) 14%,transparent)}
  .rlabel .mn{font:600 11.5px var(--mono);letter-spacing:.04em;color:var(--ink)}
  .cell{padding:clamp(5px,.85vh,8px) 14px;border-top:1px solid var(--line2);border-left:1px solid var(--line2);display:flex;flex-direction:column;justify-content:center}
  .cell.gtop{border-top:1px solid var(--line)}
  .cell.pre{grid-column:3}.cell.today{grid-column:4;background:rgba(224,163,85,.05)}.cell.future{grid-column:5;background:rgba(87,199,221,.055)}
  .ico{height:clamp(19px,2.55vh,26px);display:flex;align-items:stretch;gap:7px;margin-bottom:clamp(3px,.5vh,5px)}
  .ico>.in{height:100%;align-items:flex-end}
  .ico svg{overflow:visible;display:block;height:100%;width:auto}
  .cm{font:700 clamp(14px,1.85vh,17px)/1 var(--sans);letter-spacing:-.02em;color:var(--ink);margin-bottom:clamp(2px,.42vh,4px)}
  .cell.pre .cm{color:#c3c9d6}.cell.today .cm{color:var(--today)}.cell.future .cm{color:var(--future)}
  .ct{font:400 clamp(9.6px,1.2vh,11px)/1.3 var(--sans);color:var(--ink-soft)}
  .in{display:inline-flex;opacity:0;animation:lu .5s ease forwards}
  @keyframes lu{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  .fin{opacity:0;animation:lu .45s ease forwards}
  .gi{animation:flt 4s ease-in-out infinite}@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  .spin{animation:spin 4s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
  .dash{stroke-dasharray:5 5;animation:flow 1.1s linear infinite}@keyframes flow{to{stroke-dashoffset:-20}}
  .grow{transform:scaleX(.12);transform-box:fill-box;transform-origin:left center;animation:grow .9s cubic-bezier(.2,.7,.2,1) .1s forwards}@keyframes grow{to{transform:scaleX(1)}}
  .rise{transform:scaleY(0);transform-box:fill-box;transform-origin:bottom;animation:rise 1s cubic-bezier(.2,.7,.2,1) .2s forwards}@keyframes rise{to{transform:scaleY(1)}}
  .strike{stroke-dasharray:1;stroke-dashoffset:1;animation:drw .5s ease .5s forwards}@keyframes drw{to{stroke-dashoffset:0}}
  /* icon motion */
  .pulse{animation:pls 2.4s ease-in-out infinite}
  @keyframes pls{0%,100%{opacity:.32}50%{opacity:1}}
  .sweep{animation:swp 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom left}
  @keyframes swp{0%,100%{transform:rotate(-30deg)}50%{transform:rotate(30deg)}}
  .dr{stroke-dasharray:1;stroke-dashoffset:1;animation:drw2 3s ease-in-out infinite}
  @keyframes drw2{0%{stroke-dashoffset:1}45%,100%{stroke-dashoffset:0}}
  .bob{animation:bobb 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes bobb{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
  .beat{animation:bt 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes bt{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
  .riseb{transform:scaleY(.15);transform-box:fill-box;transform-origin:bottom;animation:rsb 2.8s ease-in-out infinite}
  @keyframes rsb{0%{transform:scaleY(.15)}45%,100%{transform:scaleY(1)}}

  /* ===== STACK (thin rail) ===== */
  #v-stack .body{flex:1;min-height:0;position:relative;padding:clamp(8px,1.6vh,18px) 0}
  .stack{position:absolute;top:50%;left:var(--sx);width:420px;
    transform:translate(var(--tx),-50%) scale(var(--ss));transform-origin:left center;
    transition:left .85s cubic-bezier(.66,0,.24,1),transform .85s cubic-bezier(.66,0,.24,1)}
  .body.s0 .stack{--sx:50%;--tx:-50%;--ss:1}
  .body.s1 .stack{--sx:0px;--tx:0px;--ss:.70}
  .body.s2 .stack{--sx:0px;--tx:0px;--ss:.44}
  .panel{position:absolute;top:0;bottom:0;right:0;left:var(--pl);
    transition:left .85s cubic-bezier(.66,0,.24,1),opacity .45s ease}
  .body.s0 .panel{--pl:100%;opacity:0;visibility:hidden}
  .body.s1 .panel{--pl:352px}
  .body.s2 .panel{--pl:226px}
  .s0hint{position:absolute;left:50%;bottom:2%;transform:translateX(-50%);font:500 11.5px var(--mono);letter-spacing:.14em;
    color:var(--ink-dim);text-transform:uppercase;opacity:0;transition:opacity .5s .35s;pointer-events:none}
  .body.s0 .s0hint{opacity:1}
  .stack{display:flex;flex-direction:column;gap:16px;justify-content:center}
  .row{display:grid;grid-template-columns:1fr 22px 190px;align-items:center;cursor:pointer}
  .lab{text-align:right}
  .lab .ln{font:600 15px var(--mono);letter-spacing:.05em;color:var(--ink-soft);transition:color .25s}
  .row.sel .lab .ln,.row:hover .lab .ln{color:var(--ink)}
  .conn{height:1px;background:var(--line);margin:0 5px;transition:.25s}
  .row.sel .conn{background:var(--acc);box-shadow:0 0 8px var(--glow)}
  .slab{display:block;width:100%;height:auto;filter:drop-shadow(0 8px 12px rgba(0,0,0,.55));transition:transform .3s cubic-bezier(.2,.7,.2,1),filter .4s}
  .slab .top{fill:#333c62;stroke:rgba(255,255,255,.14);stroke-width:1;transition:fill .4s}
  .slab .sideL{fill:#1a2036;transition:fill .4s}.slab .sideR{fill:#12172a;transition:fill .4s}
  .row:hover .slab{transform:translateY(-3px)}.row:hover .slab .top{fill:#3d4772}
  .row.sel .slab{transform:translateY(-4px) scale(1.02);filter:drop-shadow(0 8px 26px var(--glow));animation:breathe 3.4s ease-in-out infinite}
  .row.sel .slab .top{fill:var(--acc)}
  .row.sel .slab .sideL{fill:color-mix(in srgb,var(--acc) 52%,#0a0d18)}
  .row.sel .slab .sideR{fill:color-mix(in srgb,var(--acc) 34%,#080a12)}
  @keyframes breathe{0%,100%{filter:drop-shadow(0 8px 22px var(--glow))}50%{filter:drop-shadow(0 10px 36px var(--glow))}}
  .panel{border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,rgba(15,17,26,.94),rgba(10,12,19,.96));backdrop-filter:blur(14px);padding:clamp(18px,2.2vw,28px);height:100%;display:flex;flex-direction:column;min-height:0;box-sizing:border-box;box-shadow:0 30px 80px -30px rgba(0,0,0,.9);transition:opacity .32s ease,transform .32s cubic-bezier(.2,.7,.2,1)}
  .panel.swap{opacity:0;transform:translateY(8px)}
  .peyebrow{font:500 10.5px var(--mono);letter-spacing:.16em;color:var(--accent)}
  .ptitle{font-family:var(--serif);font-weight:700;font-size:clamp(26px,2.6vw,38px);line-height:1;letter-spacing:-.02em;margin:6px 0 8px}
  .pmeta{display:flex;align-items:center;gap:10px;margin:2px 0 10px}
  .pmeta .c{font:600 11px var(--mono);color:var(--accent);letter-spacing:.04em}
  .pmeta .bar-l{flex:1;height:1px;background:var(--line)}
  .boxes{display:grid;grid-template-columns:1fr 1fr 1fr;grid-auto-rows:minmax(104px,146px);align-content:center;gap:12px;flex:1;min-height:0;overflow:hidden}
  .gcols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:26px;align-content:center;flex:1;min-height:0;overflow:hidden}
  .gcol{display:flex;flex-direction:column;gap:11px;min-height:0}
  .gcol>.gh{display:flex;align-items:center;gap:10px;padding-bottom:11px;border-bottom:1.5px solid var(--accent)}
  .gcol>.gh .gn{font:700 14px var(--mono);letter-spacing:.14em;color:var(--accent)}
  .gcol .box{grid-auto-rows:unset}
  .boxes::-webkit-scrollbar{width:6px}.boxes::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:3px}
  .box{border:1px solid var(--line2);background:rgba(255,255,255,.04);border-radius:12px;padding:14px 16px 16px;transition:.18s;cursor:pointer;animation:pop .4s cubic-bezier(.2,.7,.2,1) both}
  .box:hover{border-color:color-mix(in srgb,var(--accent) 55%,transparent);background:rgba(255,255,255,.075);transform:translateY(-2px)}
  .box .bhead{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:12px}
  .bico{display:inline-flex;color:var(--accent)}.bico svg{display:block}
  .box .bico svg{width:52px;height:52px}
  .box .bi{font:600 10.5px var(--mono);color:var(--accent);letter-spacing:.05em}
  .box .bn{font:600 20px/1.12 var(--sans);letter-spacing:-.015em;margin:0;color:var(--ink)}
  .dhh{display:flex;align-items:center;gap:13px;margin:7px 0 14px}
  .bico.big{width:48px;height:48px;flex:none;border:1px solid var(--line);border-radius:13px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--accent) 9%,transparent)}
  .bico.big svg{width:30px;height:30px}
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .blankbox{grid-column:1/-1;border:1px dashed var(--line);border-radius:14px;padding:30px;text-align:center;color:var(--ink-soft)}
  .blankbox .t{font:500 12px var(--mono);letter-spacing:.14em;color:var(--accent);text-transform:uppercase}
  .blankbox p{font-size:13px;line-height:1.55;margin:12px auto 0;max-width:44ch}
  .dtop{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .back{font:500 11px var(--mono);letter-spacing:.04em;color:var(--ink-soft);cursor:pointer;padding:6px 11px;border:1px solid var(--line);border-radius:999px;transition:.18s;white-space:nowrap}

  .pill:hover{color:var(--ink-soft);border-color:var(--line)}

    .viz{flex:1;min-height:0;display:flex;align-items:center;margin:0 0 16px;border:1px solid var(--line2);border-radius:14px;background:linear-gradient(180deg,rgba(0,0,0,.5),rgba(0,0,0,.34));padding:14px 16px}
  .viz svg{display:block;width:100%;height:auto;max-height:100%;overflow:visible}
  .viz.img{padding:0;overflow:hidden;background:#000;justify-content:center}
  .viz.scene{padding:0;overflow:hidden;display:block;position:relative;background:#080a0e;cursor:grab}
  .viz.scene canvas{display:block;width:100%;height:100%}

    box-shadow:inset 0 0 60px rgba(0,0,0,.55)}
  /* the scene's chrome — an entry, an era bar, inspect chips. DOM, never in the scene */
  .e3d{position:absolute;inset:0;pointer-events:none;font-family:var(--mono);font-size:10.5px;z-index:2}

    border:1px solid rgba(255,255,255,.10);border-radius:999px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    transition:color .18s,border-color .18s,background .18s,opacity .3s}

  .e3d-chips{position:absolute;left:14px;right:14px;bottom:12px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;opacity:0;transition:opacity .5s .1s}
  .e3d-grp{display:flex;align-items:center}

  .e3d-row{display:flex;flex-wrap:wrap;gap:6px}
  .e3d.in .e3d-bar,.e3d.in .e3d-chips{opacity:1}

  .e3d-era.on i{opacity:1}
  .e3d-gap{width:6px}
  .e3d-play{width:30px;height:30px;padding:0;position:relative}

  .e3d-play.on::before{border:0;left:10px;top:9px;width:3px;height:12px;background:currentColor;box-shadow:6px 0 0 currentColor}
  .e3d-play.on{color:var(--ink)}
  .e3d-chip{padding:5px 11px;font-size:10.5px;letter-spacing:.04em;position:relative;padding-left:20px}

  .e3d-panel{position:absolute;right:16px;top:50%;transform:translate(12px,-50%);width:274px;padding:6px 18px 8px;
    background:rgba(8,10,14,.78);border:1px solid rgba(255,255,255,.10);border-radius:14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);

  .e3d-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
  .e3d-note{position:absolute;left:0;top:0;width:300px;padding:12px 14px 11px;background:rgba(8,10,14,.80);border:1px solid rgba(255,255,255,.12);
    border-radius:10px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);opacity:0;will-change:transform;pointer-events:none}

  .e3d-note em{font-style:normal;font-size:11.5px;color:var(--ink);line-height:1.35;text-align:right;align-self:baseline}

  .e3d.in .e3d-enter{opacity:0;pointer-events:none}
  .e3d.in .e3d-enter button{pointer-events:none}

    padding:12px 22px;background:rgba(8,10,14,.66);border-color:rgba(255,255,255,.16);box-shadow:0 0 0 1px rgba(255,255,255,.04),0 18px 50px rgba(0,0,0,.5)}

  .erac.pre .et{color:var(--pre)}.erac.today .et{color:var(--today)}.erac.future .et{color:var(--future)}
  .erac .ed{font:400 12px/1.42 var(--sans);color:var(--ink-soft)}
  .dpoints{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
  .dpoints li{position:relative;padding-left:20px;font-size:13.5px;line-height:1.5;color:var(--ink-soft)}
  .dpoints li::before{content:'';position:absolute;left:2px;top:7px;width:7px;height:7px;background:var(--accent);transform:rotate(45deg);border-radius:1px}
  .dpoints li b{color:var(--ink);font-weight:500}
  .dsec{font:600 10px var(--mono);letter-spacing:.16em;color:var(--ink-dim);margin:0 0 12px}

  .ver{position:fixed;right:clamp(20px,4vw,52px);bottom:12px;z-index:20;font:400 10px var(--mono);color:var(--ink-dim);letter-spacing:.06em}
  @media (max-width:900px){
    #v-home .cards,#v-stack .body{grid-template-columns:1fr;overflow:auto;align-items:start}
    .mtx{grid-template-columns:120px 1fr 1fr 1fr}
    .boxes{grid-template-columns:1fr 1fr}
    .topnav a{padding:7px 9px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}
    /* animations carry the resting state — restore it when motion is off */
    .in,.fin,.grow,.rise,.riseb,.draw,.dr,.strike,.box,.hcard{opacity:1!important;transform:none!important;stroke-dashoffset:0!important}}
</style>

<script>
const C_PRE='#8b93a6',C_TOD='#e0a355',C_FUT='#57c7dd';
const rgba=(hex,a)=>{const n=parseInt(hex.slice(1),16);return`rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;};
let fieldColorful=true;

/* ============ GLYPHS ============ */
function reveal(items){return items.map((g,i)=>'<span class="in" style="animation-delay:'+(0.08+i*0.09)+'s">'+g+'</span>').join('');}
const globe=c=>'<svg class="gi" width="24" height="24" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="'+c+'" stroke-width="1.5"/><ellipse cx="12" cy="12" rx="4" ry="9" stroke="'+c+'" stroke-width="1"/><path d="M3 12h18M4.5 7h15M4.5 17h15" stroke="'+c+'" stroke-width=".9"/></svg>';

const hex=c=>'<svg class="gi" width="21" height="23" viewBox="0 0 21 23" fill="none"><path d="M10.5 1l8.5 4.9v11L10.5 22 2 16.9v-11z" stroke="'+c+'" stroke-width="1.4"/><circle cx="10.5" cy="11.4" r="2.4" fill="'+c+'"/></svg>';
const robot=c=>'<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><rect x="4.5" y="8" width="15" height="11" rx="3" stroke="'+c+'" stroke-width="1.5"/><path d="M12 3v5" stroke="'+c+'" stroke-width="1.5"/><circle cx="12" cy="3" r="1.5" fill="'+c+'"/><circle cx="9.5" cy="13" r="1.5" fill="'+c+'"/><circle cx="14.5" cy="13" r="1.5" fill="'+c+'"/></svg>';
const chip=(L,c)=>'<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="2" y="2" width="14" height="14" rx="2.5" stroke="'+c+'" stroke-width="1.2" fill="'+c+'" fill-opacity=".14"/><text x="9" y="12.4" text-anchor="middle" font-family="var(--mono)" font-size="9" font-weight="600" fill="'+c+'">'+L+'</text></svg>';
const chips=list=>'<span style="display:inline-flex;gap:3px">'+list.map(x=>chip(x[0],x[1])).join('')+'</span>';
function net(c,mode){
  if(mode==='solid')return '<svg width="86" height="30" viewBox="0 0 86 30" fill="none"><rect x="3" y="9" width="12" height="12" rx="2.5" stroke="'+c+'" stroke-width="1.3"/><line x1="15" y1="15" x2="71" y2="15" stroke="'+c+'" stroke-width="1.5"/><rect x="71" y="9" width="12" height="12" rx="2.5" stroke="'+c+'" stroke-width="1.3"/></svg>';
  if(mode==='dci')return '<svg width="92" height="30" viewBox="0 0 92 30" fill="none"><rect x="2" y="9" width="11" height="11" rx="2.5" stroke="'+c+'" stroke-width="1.3"/><rect x="40" y="9" width="11" height="11" rx="2.5" stroke="'+c+'" stroke-width="1.3"/><rect x="79" y="9" width="11" height="11" rx="2.5" stroke="'+c+'" stroke-width="1.3"/><line class="dash" x1="13" y1="14.5" x2="40" y2="14.5" stroke="'+c+'" stroke-width="1.5"/><line class="dash" x1="51" y1="14.5" x2="79" y2="14.5" stroke="'+c+'" stroke-width="1.5"/></svg>';
  return '<svg width="92" height="34" viewBox="0 0 92 34" fill="none"><circle cx="46" cy="17" r="4" fill="'+c+'"/>'+[[8,5],[8,29],[84,5],[84,29],[4,17],[88,17]].map(p=>'<line class="dash" x1="46" y1="17" x2="'+p[0]+'" y2="'+p[1]+'" stroke="'+c+'" stroke-width="1.2"/><circle cx="'+p[0]+'" cy="'+p[1]+'" r="2.4" stroke="'+c+'" stroke-width="1.1" fill="none"/>').join('')+'</svg>';
}
function rack(c,frac){const H=30,fh=(H-4)*frac,fy=2+(H-4)-fh;return '<svg width="22" height="34" viewBox="0 0 22 34" fill="none"><rect x="4" y="2" width="14" height="'+H+'" rx="2" stroke="'+c+'" stroke-width="1.3"/><rect class="rise" x="6" y="'+fy+'" width="10" height="'+fh+'" rx="1" fill="'+c+'" fill-opacity=".55"/><line x1="4" y1="11" x2="18" y2="11" stroke="'+c+'" stroke-width=".7" opacity=".5"/><line x1="4" y1="20" x2="18" y2="20" stroke="'+c+'" stroke-width=".7" opacity=".5"/></svg>';}
const blocks=(c,n)=>'<svg width="'+(n*11+4)+'" height="26" viewBox="0 0 '+(n*11+4)+' 26" fill="none">'+Array.from({length:n},(_,i)=>'<rect x="'+(2+i*11)+'" y="'+(16-i*3)+'" width="8" height="'+(8+i*3)+'" rx="1" stroke="'+c+'" stroke-width="1.1" fill="'+c+'" fill-opacity=".12"/>').join('')+'</svg>';
const edge=c=>'<svg width="16" height="26" viewBox="0 0 16 26" fill="none"><circle cx="8" cy="13" r="3" fill="'+c+'"/><circle cx="8" cy="13" r="6.5" stroke="'+c+'" stroke-width="1" opacity=".5"/></svg>';
const buildings=c=>'<svg width="46" height="30" viewBox="0 0 46 30" fill="none">'+[[2,14],[15,8],[27,18],[36,11]].map((b,i)=>'<rect x="'+b[0]+'" y="'+b[1]+'" width="9" height="'+(28-b[1])+'" rx="1" stroke="'+c+'" stroke-width="1.1" fill="'+c+'" fill-opacity=".1"/>').join('')+'</svg>';
const bolt=c=>'<svg class="gi" width="18" height="26" viewBox="0 0 18 26" fill="none"><path d="M10 2L3 15h5l-2 9 9-14H9z" stroke="'+c+'" stroke-width="1.3" fill="'+c+'" fill-opacity=".2" stroke-linejoin="round"/></svg>';
const reactor=c=>'<svg class="gi" width="26" height="26" viewBox="0 0 26 26" fill="none"><circle cx="13" cy="13" r="3" fill="'+c+'"/><g class="spin"><ellipse cx="13" cy="13" rx="10" ry="4" stroke="'+c+'" stroke-width="1.1"/><ellipse cx="13" cy="13" rx="10" ry="4" stroke="'+c+'" stroke-width="1.1" transform="rotate(60 13 13)"/><ellipse cx="13" cy="13" rx="10" ry="4" stroke="'+c+'" stroke-width="1.1" transform="rotate(120 13 13)"/></g></svg>';
function chain(c,labels,struck){return '<svg width="'+(labels.length*25+4)+'" height="26" viewBox="0 0 '+(labels.length*25+4)+' 26" fill="none">'+labels.map((L,i)=>{const x=2+i*25;return '<rect x="'+x+'" y="6" width="21" height="14" rx="2.5" stroke="'+c+'" stroke-width="1.2" fill="'+c+'" fill-opacity="'+(struck?.05:.12)+'"/><text x="'+(x+10.5)+'" y="16" text-anchor="middle" font-family="var(--mono)" font-size="7.5" font-weight="600" fill="'+c+'" opacity="'+(struck?.55:1)+'">'+L+'</text>'+(struck?'<line class="strike" pathLength="1" x1="'+x+'" y1="20" x2="'+(x+21)+'" y2="6" stroke="'+C_FUT+'" stroke-width="1.4"/>':'');}).join('')+'</svg>';}
const sst=c=>'<svg width="56" height="26" viewBox="0 0 56 26" fill="none"><rect x="2" y="6" width="52" height="14" rx="3" stroke="'+c+'" stroke-width="1.3" fill="'+c+'" fill-opacity=".14"/><text x="28" y="16" text-anchor="middle" font-family="var(--mono)" font-size="8" font-weight="600" fill="'+c+'">SST · 800V</text></svg>';
const drop=c=>'<svg width="17" height="24" viewBox="0 0 17 24" fill="none"><path d="M8.5 3c3 4 5.5 7 5.5 10.5a5.5 5.5 0 0 1-11 0C3 10 5.5 7 8.5 3z" stroke="'+c+'" stroke-width="1.3" fill="'+c+'" fill-opacity=".15"/></svg>';

/* ---- topic glyphs (uniform 26px, Shift line-art style) ---- */
const G={};
G.reactor=c=>'<svg class="gi" viewBox="0 0 26 26" width="26" height="26" fill="none"><g class="spin"><ellipse cx="13" cy="13" rx="10" ry="4" stroke="'+c+'" stroke-width="1.2"/><ellipse cx="13" cy="13" rx="10" ry="4" stroke="'+c+'" stroke-width="1.2" transform="rotate(60 13 13)"/><ellipse cx="13" cy="13" rx="10" ry="4" stroke="'+c+'" stroke-width="1.2" transform="rotate(120 13 13)"/></g><circle class="beat" cx="13" cy="13" r="2.6" fill="'+c+'"/></svg>';
G.steps=c=>'<svg viewBox="0 0 26 26" width="26" height="26" fill="none"><path class="dr" pathLength="1" d="M3 6h6M3 6v6M9 12h6M9 12v6M15 18h6M15 18v3.5" stroke="'+c+'" stroke-width="1.5" stroke-linecap="round"/></svg>';
G.sst=c=>'<svg viewBox="0 0 26 26" width="26" height="26" fill="none"><rect x="4" y="5" width="18" height="16" rx="3" stroke="'+c+'" stroke-width="1.4"/><path class="pulse" d="M13.5 8l-3.5 6.2h3l-2 4.8 6-7.2h-3.2z" fill="'+c+'" fill-opacity=".3" stroke="'+c+'" stroke-width="1" stroke-linejoin="round"/></svg>';

const V={blue:'#5b8def',pur:'#a78bfa',pink:'#f0a6ca',yel:'#ffe066',grey:'#8b93a6',red:'#e5484d',amber:'#e0a355',cyan:'#57c7dd',green:'#6ee7a8',ink:'#e9ebf2',dim:'#8d94a6'};

const SVh=(b,h)=>'<svg viewBox="0 0 1000 '+h+'" preserveAspectRatio="xMidYMid meet">'+b+'</svg>';
function T(x,y,s,o){o=o||{};return '<text x="'+x+'" y="'+y+'" fill="'+(o.f||V.ink)+'" font-family="'+(o.m?'IBM Plex Mono':'Geist')+',sans-serif" font-size="'+(o.s||13)+'" font-weight="'+(o.w||500)+'" text-anchor="'+(o.a||'start')+'"'+(o.ls?' letter-spacing="'+o.ls+'"':'')+(o.op?' opacity="'+o.op+'"':'')+'>'+s+'</text>';}
function B(x,y,w,h,c,o){o=o||{};return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+(o.r==null?4:o.r)+'" fill="'+(o.fill||'none')+'" stroke="'+(o.sw===0?'none':c)+'" stroke-width="'+(o.sw==null?1.2:o.sw)+'"'+(o.op?' opacity="'+o.op+'"':'')+'/>';}
function LN(x1,y1,x2,y2,c,o){o=o||{};return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+(o.sw||1.2)+'"'+(o.d?' stroke-dasharray="'+o.d+'"':'')+(o.op?' opacity="'+o.op+'"':'')+' stroke-linecap="round"/>';}
function CHIP(x,y,w,h,c,l,fs){return B(x,y,w,h,c,{r:3,fill:c+'26',sw:1})+T(x+w/2,y+h/2+3.4,l,{a:'middle',s:fs||9,w:600,m:1,f:c});}
function RACK(x,y,w,h,c,n){n=n||7;let s=B(x,y,w,h,c,{r:3,fill:c+'12'});const ih=(h-12)/n;
  for(let i=0;i<n;i++)s+=B(x+5,y+6+i*ih,w-10,ih-3,c,{r:1.5,op:.55,sw:.85});

/* ---- figure grammar -------------------------------------------------
   One accent per figure — the layer's own — plus neutrals. A second hue
   only where the X axis is literally time (grey → amber → cyan) or to mark
   exactly one thing as free (green) or binding (red). The argument lives in
   the annotation: a dashed reference line, a span with the number on it, a
   leader to a named point. Titles and captions are set in italic serif so
   the figure speaks in the deck's editorial voice, not the UI's.          */
const A={power:V.amber,compute:V.cyan,dc:V.blue,apps:V.pur};
/* The accent is a stroke, an edge, a dot or a word — never a shape fill.
   Filled accent over near-black desaturates into mud (amber especially), which
   is why the landing page never does it either. The one exception is the wash
   under a chart line, which reads as area rather than as a swatch. */
const SURF='rgba(255,255,255,.045)', SLINE='rgba(255,255,255,.11)';
/* a container in the deck's own surface language, not a tinted wash */
function PANEL(x,y,w,h,o){o=o||{};
  return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+(o.r==null?10:o.r)+'" fill="'+(o.fill||SURF)+'" stroke="'+(o.stroke||SLINE)+'" stroke-width="'+(o.sw||1)+'"/>';}
function BAR(x,y,w,h,c,o){o=o||{};
  return PANEL(x,y,w,h,{r:o.r==null?5:o.r,stroke:o.live===false?SLINE:c,sw:o.live===false?1:1.15})
       + B(x,y,3.5,h,c,{r:2,fill:o.live===false?'rgba(255,255,255,.18)':c,sw:0});}
function FT(x,y,s,o){o=o||{};return '<text x="'+x+'" y="'+y+'" fill="'+(o.f||V.ink)+'" font-family="Source Serif 4,Georgia,serif" font-style="italic" font-size="'+(o.s||16)+'" font-weight="'+(o.w||400)+'" text-anchor="'+(o.a||'start')+'">'+s+'</text>';}
const FTITLE=(x,y,s)=>FT(x,y,s,{s:17.5,w:600,f:V.ink});
function WRAP(str,max){const out=[];let cur='';
  str.split(' ').forEach(w=>{if((cur+' '+w).trim().length>max){out.push(cur.trim());cur=w;}else cur+=' '+w;});
  if(cur.trim())out.push(cur.trim());return out;}
function CAP(str,o){o=o||{};const l=WRAP(str,o.max||112),y=o.y||(l.length>1?396:412);
  return l.map((t,i)=>FT(40,y+i*23,t,{s:16.5,f:V.ink})).join('');}
function NOTE(str,o){o=o||{};const l=WRAP(str,o.max||150),y=o.y||(l.length>1?428:440);
  return l.map((t,i)=>T(40,y+i*14,t,{s:10,f:V.dim})).join('');}
/* dashed reference line with its value at one end */
function RULE(x1,x2,y,c,label,o){o=o||{};
  let r=LN(x1,y,x2,y,c,{sw:1.3,d:'7 5',op:o.op==null?.9:o.op});
  if(label)r+=T(o.left?x1:x2,y-9,label,{a:o.left?'start':'end',s:11.5,w:600,f:c,m:1});
  return r;}
/* the gap between two rules, with the number that names it */
function SPAN(x,ya,yb,c,val,sub){
  let s=LN(x,ya+8,x,yb-8,c,{sw:1.5});
  s+='<path d="M'+x+' '+ya+' l-4.5 9 h9 z" fill="'+c+'"/><path d="M'+x+' '+yb+' l-4.5 -9 h9 z" fill="'+c+'"/>';
  s+=FT(x+14,(ya+yb)/2-1,val,{s:21,w:600,f:c});
  if(sub)s+=T(x+14,(ya+yb)/2+17,sub,{s:11,f:V.dim});
  return s;}
/* leader from a plotted point out to a named label */
function LEAD(px,py,lx,ly,c,label,sub){

function miniTrend(vals,idx,c){const mx=Math.max.apply(null,vals);let o='';
  vals.forEach(function(v,i){const h=Math.max(3,Math.round(Math.sqrt(v/mx)*19)),x=2+i*12;
    o+='<rect class="riseb" style="animation-delay:'+(i*0.14)+'s" x="'+x+'" y="'+(22-h)+'" width="9" height="'+h+'" rx="1.5" fill="'+c+'" fill-opacity="'+(i===idx?'.95':'.26')+'"/>';});
  return '<svg width="38" height="24" viewBox="0 0 38 24" fill="none">'+o+'<line x1="0" y1="23.5" x2="38" y2="23.5" stroke="'+c+'" stroke-width="1" opacity=".25"/></svg>';}
function miniLine(pts,c,shade){const d='M'+pts.map(function(q,i){return (i*(46/(pts.length-1))).toFixed(1)+' '+(22-q*18).toFixed(1);}).join(' L');
  return '<svg width="48" height="24" viewBox="0 0 48 24" fill="none">'
   +(shade?'<path d="'+d+' L46 23 L0 23 Z" fill="'+c+'" opacity=".18"/>':'')

/* ============================================================
   THE 3D SCENES — one kit, one rig, two scenes.
   sceneKit: geometry and material helpers with resource tracking.
   sceneRig: renderer, film camera, chapters, pins, chrome, loop,
   dispose. A scene builds its world and hands the rig its stops.
   ============================================================ */
(function(){
'use strict';

function sceneKit(T){
  var mats=[], geos=[], gc={}, K={mats:mats,geos:geos};
  function mat(color,o){o=o||{};
    var m=new T.MeshStandardMaterial({color:color,
      roughness:o.r!=null?o.r:.74, metalness:o.m!=null?o.m:.36,
      emissive:o.e!=null?o.e:0x000000, emissiveIntensity:o.ei!=null?o.ei:1,
      transparent:!!o.t, opacity:o.o!=null?o.o:1, side:o.s||T.FrontSide,
      depthWrite:o.dw!=null?o.dw:true});
    if(o.env!=null) m.envMapIntensity=o.env;
    mats.push(m); return m; }
  function lit(color,i,op){ return mat(0x000000,{e:color,ei:i==null?2.2:i,r:.5,m:0,t:op!=null,o:op}); }
  function G(g){ geos.push(g); return g; }
  function BG(w,h,d){var k='b'+w+'_'+h+'_'+d; return gc[k]||(gc[k]=G(new T.BoxGeometry(w,h,d)));}
  function CG(rt,rb,h,s){var k='c'+rt+'_'+rb+'_'+h+'_'+(s||10); return gc[k]||(gc[k]=G(new T.CylinderGeometry(rt,rb,h,s||10)));}
  function SG(r,s){var k='s'+r+'_'+(s||12); return gc[k]||(gc[k]=G(new T.SphereGeometry(r,s||12,(s||12)/2)));}
  function box(w,h,d,m,x,y,z,cast){var e=new T.Mesh(BG(w,h,d),m);e.position.set(x||0,y||0,z||0);
    if(cast){e.castShadow=true;e.receiveShadow=true;} return e;}
  function cyl(rt,rb,h,m,x,y,z,s){var e=new T.Mesh(CG(rt,rb,h,s),m);e.position.set(x||0,y||0,z||0);return e;}
  function V(p){return new T.Vector3(p[0],p[1],p[2]);}
  function tube(pts,r,m,seg,rad){
    var c=new T.CatmullRomCurve3(pts.map(V));
    return new T.Mesh(G(new T.TubeGeometry(c,seg||20,r,rad||5,false)),m);}
  function bundle(g,pts,r,m,n,spread){
    for(var i=0;i<n;i++){ var o=(i-(n-1)/2)*spread;
      g.add(tube(pts.map(function(p){return [p[0],p[1]+(i%2?o*.4:0),p[2]+o];}),r,m,18)); } }
  var dummy=new T.Object3D();
  function inst(geom,material,count,cast){
    var im=new T.InstancedMesh(geom,material,count); im.count=0;
    if(cast){im.castShadow=true;im.receiveShadow=true;}

/* ====== FIELD: fine LED pixels ======================================
   The pixel field is the identity, so the three interactions from the
   reference are done in pixel space rather than with geometry:
   · scan-reveal — a wavefront expands from off-frame, a bright rim riding
     the front with a dim trail behind it, wobbled so it is not a clean circle
   · pointer orbit — the blobs are sprung toward the pointer by depth, which
     parallaxes the field instead of moving a camera
   · particle spray — a ring buffer emitted along the pointer's path, drag,
     lift and wander integrated per frame, splatted straight into the grid  */
(function(){
  const cv=document.getElementById('field'),x=cv.getContext('2d');
  const CELL=8, REDUCED=matchMedia('(prefers-reduced-motion:reduce)').matches;
  let W,H,COLS,ROWS,img,data;
  const ptr={x:-9999,y:-9999};
  const PAL=[[64,86,128],[52,96,112],[74,84,118],[46,78,104],[86,92,120],[58,88,124]];
  const L=[];for(let k=0;k<6;k++)L.push({sx:.09+Math.random()*.13,sy:.08+Math.random()*.13,ax:.30+Math.random()*.16,ay:.30+Math.random()*.16,px:Math.random()*6.28,py:Math.random()*6.28,dep:.4+k*.16,c:PAL[k%PAL.length]});
  const BF=[];for(let k=0;k<10;k++)BF.push({x:Math.random(),y:Math.random(),vx:(Math.random()-.5)*.018,vy:-.010-Math.random()*.016,rot:Math.random()*6.28,rs:(Math.random()-.5)*.55,sz:.030+Math.random()*.040,ph:Math.random()*6.28,fs:2.2+Math.random()*1.6,c:[96,104,130]});
  /* holographic shells — thin elliptical isolines that precess slowly, and a
     static starfield hashed per cell so it does not crawl between frames */
  const RG=[{rx:.44,ry:.30,a0:0.15,sp:.030,w:.0075},
            {rx:.33,ry:.44,a0:1.95,sp:-.023,w:.0065},
            {rx:.53,ry:.21,a0:0.90,sp:.017,w:.0055},
            {rx:.24,ry:.26,a0:2.60,sp:-.038,w:.0085}];
  const hash=(i,j)=>(((i*73856093)^(j*19349663))>>>0)%10000/10000;
  const EX=[];let nextEx=1.2;
  function boom(a,b){EX.push({x:a,y:b,t0:-1,life:1.35});}

  /* --- scan wavefront --- */
  let scanR=0,scanning=false,scanT=0,scanMax=2600,wire=1;
  const SCAN_DUR=2.4, so={x:0,y:0};
  window.__scan=function(){
    if(REDUCED){scanning=false;scanR=1e9;wire=0;return;}
    so.x=-W*0.22; so.y=H*1.05; scanR=0; scanT=0; scanning=true; wire=1;
  };

  /* --- spray --- */
  const P_N=460,P_LIFE=1.5;
  const pX=new Float32Array(P_N),pY=new Float32Array(P_N),pVX=new Float32Array(P_N),
        pVY=new Float32Array(P_N),pB=new Float32Array(P_N),pR=new Float32Array(P_N);
  for(let i=0;i<P_N;i++)pB[i]=-999;
  let head=0,lastX=9e9,lastY=0,idle=0,T=0;
  const rand=(a,b)=>a+Math.random()*(b-a);
  function spawn(sx,sy){
    const i=head;head=(head+1)%P_N;
    pX[i]=sx+rand(-6,6);pY[i]=sy+rand(-6,6);
    pVX[i]=rand(-26,26);pVY[i]=-rand(6,52);
    pB[i]=T;pR[i]=Math.random();
  }
  function emit(dt){
    if(REDUCED)return;
    if(ptr.x<-9000){lastX=9e9;return;}
    if(lastX>8e9){lastX=ptr.x;lastY=ptr.y;return;}
    const d=Math.hypot(ptr.x-lastX,ptr.y-lastY),n=Math.min(14,Math.floor(d/7));
    for(let k=1;k<=n;k++)spawn(lastX+(ptr.x-lastX)*k/n, lastY+(ptr.y-lastY)*k/n);
    if(n>0){lastX=ptr.x;lastY=ptr.y;idle=0;}
    else{idle+=dt;if(idle>.055){spawn(ptr.x,ptr.y);idle=0;}}
  }

  function rs(){W=innerWidth;H=innerHeight;COLS=Math.ceil(W/CELL);ROWS=Math.ceil(H/CELL);
    cv.width=COLS;cv.height=ROWS;img=x.createImageData(COLS,ROWS);data=img.data;
    scanMax=Math.hypot(W,H)*1.55+600;}
  addEventListener('resize',rs);rs();
  addEventListener('mousemove',e=>{ptr.x=e.clientX;ptr.y=e.clientY;});
  addEventListener('mouseout',()=>{ptr.x=ptr.y=-9999;});
  addEventListener('click',e=>boom(e.clientX,e.clientY));
  window.__scan();

  /* one reticle per blob; the field already knows where they are */
  const hud=document.getElementById('hud'),TRK=[];
  /* three, spread as a triangle clear of the title and both cards */
  const ANCH=[[.145,.180,'#6ee7a8'],[.858,.175,'#57c7dd'],[.500,.855,'#e0a355']];
  (function(){ANCH.forEach(function(a,k){const d=document.createElement('div');
      d.className='trk';d.style.setProperty('--tc',a[2]);
      d.innerHTML='<i></i><i></i><i></i><i></i><b></b>';
      hud.appendChild(d);TRK.push({el:d,lb:d.querySelector('b'),ph:k*1.7});});
    const f=document.createElement('div');f.className='vfind';
    f.innerHTML='<i></i><i></i><i></i><i></i>';hud.appendChild(f);})();
  let hudTick=0;
  const sm={x:0,y:0};
  let last=0,ab=null;
  function loop(t){
    const tt=t*0.001,dt=Math.min(.05,last?tt-last:.016);last=tt;T=tt;
    const acc=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#6f8dff';
    const nn=parseInt(acc.slice(1),16),AR=nn>>16&255,AG=nn>>8&255,AB=nn&255,colorful=fieldColorful;
    const scale=Math.pow(Math.min(W,H)*0.2,2);
    if(scanning){scanT+=dt/SCAN_DUR;const e=Math.min(1,scanT);
      scanR=(1-Math.pow(1-e,1.35))*scanMax;if(e>=1)scanning=false;}
    else if(wire>0.18)wire+=(0.18-wire)*0.04;
    nextEx-=dt;if(nextEx<=0&&!REDUCED){nextEx=2.6+Math.random()*3.4;boom((.15+Math.random()*.7)*W,(.15+Math.random()*.7)*H);}
    for(let k=EX.length-1;k>=0;k--){const e=EX[k];e.t0+=dt;if(e.t0>e.life)EX.splice(k,1);}
    /* pointer spring — parallax, not a camera */
    const tx=ptr.x>-9000?(ptr.x/W)*2-1:0, ty=ptr.y>-9000?(ptr.y/H)*2-1:0;
    sm.x+=(tx-sm.x)*0.055;sm.y+=(ty-sm.y)*0.055;
    const lp=L.map(l=>[(0.5+l.ax*Math.sin(tt*l.sx+l.px))*W - sm.x*l.dep*90,
                       (0.5+l.ay*Math.sin(tt*l.sy+l.py))*H - sm.y*l.dep*60]);
    const bp=BF.map(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt;b.rot+=b.rs*dt;
      if(b.y<-.15){b.y=1.15;b.x=Math.random();}if(b.x<-.15)b.x=1.15;if(b.x>1.15)b.x=-.15;
      const flap=.42+.58*Math.abs(Math.sin(tt*b.fs+b.ph));
      const a=b.sz*Math.min(W,H),bb=a*flap*0.42;
      return[b.x*W,b.y*H,Math.cos(b.rot),Math.sin(b.rot),1/(a*a),1/(bb*bb)];});
    for(let j=0;j<ROWS;j++){const cy=j*CELL+CELL*.5;
      for(let i=0;i<COLS;i++){const cx=i*CELL+CELL*.5;
        let R=0,G=0,B=0,I=0,w,dx,dy,c;
        for(let k=0;k<6;k++){dx=cx-lp[k][0];dy=cy-lp[k][1];w=1/((dx*dx+dy*dy)/scale+1);I+=w;c=colorful?L[k].c:null;
          if(c){R+=w*c[0];G+=w*c[1];B+=w*c[2];}else{R+=w*AR;G+=w*AG;B+=w*AB;}}
        for(let k=0;k<10;k++){const b=bp[k];dx=cx-b[0];dy=cy-b[1];
          const u=dx*b[2]+dy*b[3],v=-dx*b[3]+dy*b[2],d2=u*u*b[4]+v*v*b[5];
          if(d2<9){w=1.5/(d2*d2+1);I+=w;c=colorful?BF[k].c:null;
            if(c){R+=w*c[0];G+=w*c[1];B+=w*c[2];}else{R+=w*AR;G+=w*AG;B+=w*AB;}}}
        /* the survey pulse — rim on the front, dim trail behind it */
        if(wire>0.001){
          dx=cx-so.x;dy=cy-so.y;
          const wob=Math.sin(cy*0.011+cx*0.007)*30+Math.sin(cx*0.021+cy*0.013)*14;
          const d=Math.sqrt(dx*dx+dy*dy)+wob;
          const q=(d-scanR)/70, rim=Math.exp(-q*q);
          const trail=d<scanR?Math.min(1,(scanR-d)/620):0;
          w=(rim*1.7+trail*0.26)*wire;
          if(w>0.002){I+=w;R+=w*186;G+=w*206;B+=w*242;}
        }
        for(let k=0;k<EX.length;k++){const e=EX[k],pr=e.t0/e.life;if(pr<0)continue;
          const rr=pr*Math.min(W,H)*.55,th=26+pr*70;dx=cx-e.x;dy=cy-e.y;
          const d=Math.sqrt(dx*dx+dy*dy),g=1-Math.abs(d-rr)/th;
          if(g>0){w=g*g*3.0*(1-pr);I+=w;R+=w*170;G+=w*186;B+=w*214;}}
        if(ptr.x>-9000){dx=cx-ptr.x;dy=cy-ptr.y;w=1.35/((dx*dx+dy*dy)/(scale*.26)+1);I+=w;
          if(colorful){R+=w*150;G+=w*168;B+=w*200;}else{R+=w*AR;G+=w*AG;B+=w*AB;}}

        for(let k=0;k<4;k++){const rg=RG[k],an=rg.a0+tt*rg.sp*(REDUCED?0:1),ca=Math.cos(an),sa=Math.sin(an);
          const u=(rx0*ca+ry0*sa)/(rg.rx*W), v=(-rx0*sa+ry0*ca)/(rg.ry*H);

          if(e>.455){w=(e-.455)*3.0;I+=w;R+=w*196;G+=w*214;B+=w*246;}}

        let inten=I/1.5;inten=inten>1?1:inten;
        const a=Math.pow(inten,2.25)*0.40+hv*.005;

        R/=I;G/=I;B/=I;
        data[o]=R>255?255:R;data[o+1]=G>255?255:G;data[o+2]=B>255?255:B;data[o+3]=a*255;
      }

      const age=T-pB[k];if(age<0||age>P_LIFE)continue;
      const u=age/P_LIFE;
      const sx=pX[k]+pVX[k]*age*(1-0.34*u)+Math.sin(pR[k]*6.28+age*2.6)*22*u;
      const sy=pY[k]+pVY[k]*age*(1-0.34*u)-46*age;
      const al=Math.min(1,(u<0.09?u/0.09:1)*(u>0.40?Math.max(0,1-(u-0.40)/0.60):1));
      if(al<=0.01)continue;
      const ci=Math.round(sx/CELL),cj=Math.round(sy/CELL);
      for(let dj=-1;dj<=1;dj++)for(let di=-1;di<=1;di++){
        const ii=ci+di,jj=cj+dj;if(ii<0||jj<0||ii>=COLS||jj>=ROWS)continue;

        data[o+1]=Math.min(255,data[o+1]+162*add);
        data[o+2]=Math.min(255,data[o+2]+200*add);
        data[o+3]=Math.min(255,data[o+3]+add*150);
      }
    }
    if(++hudTick%9===0&&hud.classList.contains('on')){
      for(let k=0;k<TRK.length;k++){const t=TRK[k],a=ANCH[k];
        const fx=a[0]+Math.sin(tt*.11+t.ph)*.012-sm.x*.010,
              fy=a[1]+Math.cos(tt*.09+t.ph*1.3)*.010-sm.y*.008;
        t.el.style.left=(fx*W).toFixed(0)+'px';t.el.style.top=(fy*H).toFixed(0)+'px';
        t.lb.textContent='TRK '+String(k+1).padStart(2,'0')+' · X'+fx.toFixed(2)+' Y'+fy.toFixed(2)+' · LOCK';}}
    /* RGB split — red pulled one cell left, blue one right, weighted by how
       bright the cell already is, so only the lit edges fringe */
    if(!REDUCED){
      if(!ab||ab.length!==data.length)ab=new Uint8ClampedArray(data.length);
      ab.set(data);
      for(let j=0;j<ROWS;j++){const row=j*COLS;
        for(let i=1;i<COLS-1;i++){const o=(row+i)<<2;
          const al=ab[o+3];if(al<10)continue;
          const oL=(row+i-1)<<2, oR=(row+i+1)<<2;
          data[o]  =ab[oL]*.70+ab[o]*.30;
          data[o+2]=ab[oR+2]*.70+ab[o+2]*.30;}}
    }
    x.putImageData(img,0,0);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
