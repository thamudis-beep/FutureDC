<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Future of the Data Center</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --ground:#242e2b; --ground2:#1b2321;
    --ink:#eae7dc; --ink-soft:#a6ada1;
    --cream:#f2eee4; --cream-ink:#20241f; --cream-soft:#6c7266; --cream-line:#ddd8c9;
    --dome:207,210,192;     /* rgb of the light-dome haze (shifts per module) */
    --accent:#c79a5e;       /* warm bronze default */
    --sage:#9fb3a3;
    --serif:'Instrument Serif',Georgia,serif; --sans:'Instrument Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:var(--sans);color:var(--ink);overflow:hidden}
  body{transition:background 1.1s ease;
    background:
      radial-gradient(78% 62% at 50% 86%, rgba(var(--dome),.22), rgba(var(--dome),.05) 46%, transparent 66%),
      radial-gradient(120% 90% at 50% 6%, rgba(0,0,0,.36), transparent 52%),
      linear-gradient(180deg,var(--ground2),var(--ground) 58%,#1f2e29)}
  #motes{position:fixed;inset:0;z-index:1;pointer-events:none}
  .grain{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.03;mix-blend-mode:overlay;background-image:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 3px)}
  .base{position:fixed;left:0;right:0;bottom:0;height:42vh;z-index:1;pointer-events:none;overflow:hidden}
  .base svg{position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);width:1600px;max-width:150vw;opacity:.55}

  /* pill nav */
  .nav{position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:2px;
    padding:6px;border-radius:999px;background:rgba(18,26,23,.52);backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.09);box-shadow:0 18px 50px rgba(0,0,0,.36);max-width:94vw}
  .nav .home{display:flex;align-items:center;gap:9px;padding:9px 14px;border-radius:999px;cursor:pointer;flex:none}
  .nav .home .dia{width:9px;height:9px;background:var(--accent);transform:rotate(45deg);border-radius:1px;transition:background .8s}
  .nav .home b{font-weight:600;font-size:13px;letter-spacing:.02em;white-space:nowrap}
  .nav .sep{width:1px;height:18px;background:rgba(255,255,255,.1);margin:0 4px;flex:none}
  .nav .tabs{display:flex;gap:2px;overflow:auto;scrollbar-width:none}.nav .tabs::-webkit-scrollbar{display:none}
  .nav a{padding:9px 15px;border-radius:999px;font-size:12.5px;color:var(--ink-soft);cursor:pointer;transition:.2s;white-space:nowrap}
  .nav a:hover{color:var(--ink);background:rgba(255,255,255,.05)}
  .nav a.on{color:var(--cream-ink);background:var(--cream)}

  /* screens */
  .stage{position:fixed;inset:0;z-index:5}
  .screen{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .55s ease,transform .55s cubic-bezier(.2,.7,.2,1);
    transform:translateY(14px);pointer-events:none}
  .screen.on{opacity:1;visibility:visible;transform:none;pointer-events:auto}

  .wrap{position:absolute;left:7vw;right:7vw;top:0;bottom:0;display:flex;align-items:center}

  /* ---- home ---- */
  .home-copy{max-width:min(560px,46vw)}
  .kick{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--sage);margin-bottom:20px}
  h1{font-family:var(--serif);font-weight:400;font-size:clamp(44px,6.2vw,84px);line-height:1.0;letter-spacing:-.01em;margin:0}
  h1 .it{font-style:italic}
  .sub{font-size:16px;line-height:1.65;color:var(--ink-soft);margin:24px 0 0;max-width:42ch}
  .cta{display:inline-flex;align-items:center;gap:10px;margin-top:28px;padding:13px 22px;border-radius:999px;cursor:pointer;
    background:var(--cream);color:var(--cream-ink);font-size:13px;font-weight:600;box-shadow:0 16px 40px -12px rgba(0,0,0,.5);transition:.2s}
  .cta:hover{transform:translateY(-2px)}.cta .ar{transition:transform .2s}.cta:hover .ar{transform:translateX(4px)}
  .eras{position:absolute;right:0;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:14px;width:min(320px,34vw)}
  .eracard{background:var(--cream);color:var(--cream-ink);border-radius:18px;padding:15px 17px;box-shadow:0 30px 60px -26px rgba(0,0,0,.55);
    display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .eracard .l .t{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--cream-soft)}
  .eracard .l .n{font-family:var(--serif);font-size:22px;line-height:1.1;margin-top:2px}
  .eracard .fig{font-family:var(--serif);font-size:30px;white-space:nowrap}
  .eracard .fig span{font-family:var(--sans);font-size:12px;color:var(--cream-soft)}
  .eracard.future{outline:1px solid var(--accent)}

  /* ---- module ---- */
  .m-left{width:min(430px,40vw);flex:none}
  .m-eyebrow{font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--sage);margin-bottom:14px}
  .m-title{font-family:var(--serif);font-weight:400;font-size:clamp(46px,6vw,80px);line-height:.98;margin:0 0 16px}
  .m-thesis{font-size:15px;line-height:1.6;color:var(--ink-soft);max-width:38ch;margin:0 0 26px}
  .subnav{display:flex;flex-direction:column;gap:1px;max-width:400px}
  .subitem{display:flex;align-items:center;gap:14px;padding:11px 12px;border-radius:12px;cursor:pointer;transition:.18s;border:1px solid transparent}
  .subitem:hover{background:rgba(255,255,255,.045)}
  .subitem.on{background:rgba(242,238,228,.08);border-color:rgba(242,238,228,.14)}
  .subitem .si{font-size:11px;color:var(--ink-soft);width:22px;font-variant-numeric:tabular-nums}
  .subitem .sn{font-size:15.5px;color:var(--ink);font-weight:500}
  .subitem.on .si{color:var(--accent)}
  .m-right{flex:1;display:flex;align-items:center;justify-content:center;position:relative}
  .fcard{width:min(430px,40vw);background:var(--cream);color:var(--cream-ink);border-radius:24px;padding:16px;
    box-shadow:0 50px 100px -30px rgba(0,0,0,.62),0 8px 22px rgba(0,0,0,.22);transition:opacity .4s ease,transform .4s cubic-bezier(.2,.7,.2,1)}
  .fcard.swap{opacity:0;transform:translateY(10px)}
  .fcard .pic{height:150px;border-radius:16px;overflow:hidden;position:relative;background:var(--pic)}
  .fcard .plabel{position:absolute;left:14px;bottom:12px;font-family:var(--serif);font-size:22px;color:#fff;opacity:.92;text-shadow:0 2px 12px rgba(0,0,0,.35)}
  .fcard .lbl{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--cream-soft);margin:16px 4px 0}
  .fcard h3{font-family:var(--serif);font-weight:400;font-size:30px;line-height:1.02;margin:5px 4px 8px}
  .fcard p{font-size:13.5px;line-height:1.55;color:#40453c;margin:0 4px}
  .fcard .arc{margin:14px 4px 4px;font-size:11px;letter-spacing:.04em;color:var(--cream-soft);display:flex;gap:7px;align-items:center;flex-wrap:wrap}
  .fcard .arc b{color:var(--accent);font-weight:600}
  .blank{color:var(--ink-soft);font-size:15px;max-width:36ch;line-height:1.6}
  .blank .tag{display:inline-block;margin-top:14px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--sage);border:1px solid rgba(159,179,163,.4);border-radius:999px;padding:6px 12px}

  .foot{position:fixed;left:7vw;bottom:22px;z-index:6;font-size:11px;letter-spacing:.06em;color:var(--ink-soft);opacity:.7}
  @media (max-width:900px){
    .wrap{flex-direction:column;align-items:flex-start;justify-content:center;gap:22px}
    .home-copy{max-width:90vw}.eras{position:static;transform:none;width:100%;flex-direction:row;flex-wrap:wrap}
    .m-left{width:100%}.m-right{width:100%;justify-content:flex-start}.fcard{width:100%}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="motes"></canvas><div class="grain"></div>
<div class="base"><svg viewBox="0 0 1600 300" preserveAspectRatio="xMidYMax meet"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c3a34" stop-opacity="0"/><stop offset="1" stop-color="#121a17" stop-opacity=".92"/></linearGradient></defs><path d="M0,300 L0,190 Q280,120 520,175 T980,150 Q1250,108 1600,178 L1600,300 Z" fill="url(#bg)"/></svg></div>

<nav class="nav">
  <div class="home" data-go="home"><span class="dia"></span><b>Future&nbsp;DC</b></div>
  <div class="sep"></div>
  <div class="tabs" id="tabs"></div>
</nav>

<div class="stage" id="stage"></div>
<div class="foot" id="foot">Future of the Data Center · past · present · future</div>

<script>
const MODS=[
 {id:'home',tab:'Home'},
 {id:'power',tab:'Power',no:'01',title:'Power',eyebrow:'Module 01 · the bottom of the stack',
  dome:'214,176,120',accent:'#d4a45f',
  thesis:'The problem isn’t energy — it’s building new generation, and getting it to the chip without losing it along the way.',
  subs:[
   {n:'Generation & sources',d:'Gas, nuclear, renewables, solar — the real bottleneck is bringing new generation online at all.',pic:'radial-gradient(120% 100% at 30% 20%,#e6d8bd,#c79a5e 60%,#6f5836)',arc:['the macro problem']},
   {n:'Grid & voltage loss',d:'Generate → substation → transformer → step-down to the chip. Every conversion sheds power.',pic:'radial-gradient(120% 100% at 70% 20%,#dfe3d4,#9aa78f 60%,#4d5645)',arc:['AC','one device']},
   {n:'800V & SST',d:'Solid-state transformers collapse the entire step-down chain into a single device.',pic:'radial-gradient(120% 100% at 40% 30%,#eadcc0,#c79a5e 55%,#5f4a2c)',arc:["today's chain",'one device']},
   {n:'Behind the meter',d:'Move generation right next to the data center and skip the grid. An economics play, not a physics one.',pic:'radial-gradient(120% 100% at 60% 25%,#e3dcc9,#b3a684 60%,#5a5236)',arc:['economics']},
   {n:'Storage & load-shifting',d:'Run generation flat-out overnight and bank it for the peak. A power problem becomes a timing one.',pic:'radial-gradient(120% 100% at 35% 30%,#dfe4d6,#93a487 60%,#4a5641)',arc:['base','peak']},
   {n:'Solar & Space',d:'Where the sun actually pays — Saudi, China, the US west — and the orbital option beyond the grid.',pic:'radial-gradient(120% 100% at 65% 25%,#e7dcc4,#c79a5e 55%,#5c4a30)',arc:['geography of the sun']},
   {n:'Geography & regulatory',d:'Sources ≠ location. Who can generate, and who will actually permit it.',pic:'radial-gradient(120% 100% at 45% 30%,#dbe0d2,#8fa085 60%,#48533f)',arc:['geo · policy']},
  ]},
 {id:'compute',tab:'Compute',no:'02',title:'Compute',eyebrow:'Module 02 · silicon & the fabric',
  dome:'150,196,214',accent:'#6fb2c7',
  thesis:'What architecture does AGI actually need? Silicon, memory and the fabric that binds them are all being re-drawn.',
  subs:[
   {n:'Architecture',d:'Heterogeneous CPU · GPU · QPU in ratios the workload sets. Shrink is out of gas, so the industry builds up.',pic:'radial-gradient(120% 100% at 30% 25%,#cfe0e6,#6fa3b6 60%,#38525c)',arc:['X shrink','Y stack']},
   {n:'Memory',d:'AGI is memory-hungry. HBM · 3D-DRAM · NAND — the answer is to put memory everywhere.',pic:'radial-gradient(120% 100% at 70% 25%,#d6e2e6,#7fa8b4 60%,#3f565e)',arc:['the memory wall']},
   {n:'Networking',d:'Copper runs out of reach; optics move inward — scale-up, scale-out, scale-across.',pic:'radial-gradient(120% 100% at 45% 30%,#cfe1e5,#6fa6b6 60%,#37535c)',arc:['copper','light']},
   {n:'Co-design & the moat',d:'Model ↔ chip co-design, and AI-designed compilers routing around the CUDA moat.',pic:'radial-gradient(120% 100% at 55% 25%,#d8e2e4,#83aab2 60%,#42585d)',arc:['software ↔ silicon']},
  ]},
 {id:'dc',tab:'Data Center',no:'03',title:'The Data Center',eyebrow:'Module 03 · the machine & the money',
  dome:'176,186,204',accent:'#9aa9c9',
  thesis:'"Data center" is an umbrella word. Underneath sit distinct players, distinct economics, and a deeply local, physical business.',
  subs:[
   {n:'The players',d:'PowerShells (miners → AI) · bare-metal compute · inference & software. Three layers, often mistaken for one.',pic:'radial-gradient(120% 100% at 30% 25%,#dce0ea,#9aa6c2 60%,#4d566e)',arc:['who builds']},
   {n:'The economics',d:'Infra went from ~20% of cost to ~75%. Now it has to be financed — IRRs, payback, half-trillion-dollar vehicles.',pic:'radial-gradient(120% 100% at 70% 25%,#e0e3ec,#a6b0c8 60%,#535c72)',arc:['20%','75%']},
   {n:'Build & design',d:'Monolithic campuses → modular, prefab factories (build once, ship to site) → edge nodes. Labor is the constraint.',pic:'radial-gradient(120% 100% at 45% 30%,#dde1ea,#9ba7c2 60%,#4e576f)',arc:['monolith','prefab · edge']},
   {n:'Geography & regulation',d:'Most countries can’t build models or chips — but they can build data centers and power. Regulation decides where it lands.',pic:'radial-gradient(120% 100% at 55% 25%,#e1e4ec,#a9b2c9 60%,#555f74)',arc:['local · BYOC']},
   {n:'Space',d:'Off-planet data centers as a geography of their own — free power, passive cooling, no permits.',pic:'radial-gradient(120% 100% at 50% 30%,#d8dcea,#8f9cc0 60%,#454f6c)',arc:['the frontier']},
  ]},
 {id:'apps',tab:'Applications',no:'04',title:'Applications',eyebrow:'Module 04 · the work on top',
  dome:'190,170,206',accent:'#b79bd0',
  thesis:'The workloads that pull the entire rebuild beneath them — language, physical AI, science.',
  blank:true},
];

// --- build nav ---
const tabsEl=document.getElementById('tabs');
MODS.filter(m=>m.id!=='home').forEach(m=>{ const a=document.createElement('a'); a.textContent=m.tab; a.dataset.go=m.id; tabsEl.appendChild(a); });
document.querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click',()=>go(el.dataset.go)));

// --- build screens ---
const stage=document.getElementById('stage');
function el(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;}
function arcHtml(a){ if(!a)return''; if(a.length>1) return '<div class="arc"><span>'+a[0]+'</span><span style="color:#b9b4a4">→</span><b>'+a[a.length-1]+'</b></div>'; return '<div class="arc"><span>'+a[0]+'</span></div>'; }

// home
const home=el('div','screen','');home.id='s-home';
home.innerHTML=
 '<div class="wrap"><div class="home-copy">'+
   '<div class="kick">Future of the Data Center</div>'+
   '<h1>The machine behind<br>the <span class="it">intelligence.</span></h1>'+
   '<p class="sub">Every layer — power, compute, the data center, the applications on top — is being redesigned at once. Read it across time: from cloud, to AI training, to AGI.</p>'+
   '<div class="cta" data-go="power">Enter the stack <span class="ar">→</span></div>'+
 '</div>'+
 '<div class="eras">'+
   '<div class="eracard"><div class="l"><div class="t">T−1 · Past</div><div class="n">Cloud / Internet</div></div><div class="fig">3<span> kW</span></div></div>'+
   '<div class="eracard"><div class="l"><div class="t">T0 · Present</div><div class="n">AI Training</div></div><div class="fig">150<span> kW</span></div></div>'+
   '<div class="eracard future"><div class="l"><div class="t">T+1 · Future</div><div class="n">AGI</div></div><div class="fig">1<span> MW</span></div></div>'+
 '</div></div>';
stage.appendChild(home);
home.querySelector('.cta').addEventListener('click',()=>go('power'));

// modules
MODS.filter(m=>m.id!=='home').forEach(m=>{
  const s=el('div','screen');s.id='s-'+m.id;
  if(m.blank){
    s.innerHTML='<div class="wrap"><div class="m-left"><div class="m-eyebrow">'+m.eyebrow+'</div><h2 class="m-title">'+m.title+'</h2>'+
      '<p class="m-thesis">'+m.thesis+'</p><div class="blank">Language · physical AI · scientific — each pulls a different stack. <br><span class="tag">Module in progress</span></div></div><div class="m-right"></div></div>';
    stage.appendChild(s);return;
  }
  const left=el('div','m-left');
  left.innerHTML='<div class="m-eyebrow">'+m.eyebrow+'</div><h2 class="m-title">'+m.title+'</h2><p class="m-thesis">'+m.thesis+'</p>';
  const subnav=el('div','subnav');
  m.subs.forEach((sub,i)=>{ const it=el('div','subitem'+(i===0?' on':''),'<span class="si">0'+(i+1)+'</span><span class="sn">'+sub.n+'</span>'); it.dataset.i=i; subnav.appendChild(it); });
  left.appendChild(subnav);
  const right=el('div','m-right'); const card=el('div','fcard'); right.appendChild(card);
  s.appendChild(el('div','wrap')); s.querySelector('.wrap').appendChild(left); s.querySelector('.wrap').appendChild(right);
  stage.appendChild(s);
  function render(i){ const sub=m.subs[i];
    card.classList.add('swap');
    setTimeout(()=>{ card.style.setProperty('--pic',sub.pic);
      card.innerHTML='<div class="pic"><div class="plabel">'+String(i+1).padStart(2,'0')+'</div></div>'+
        '<div class="lbl">'+m.title+' · 0'+(i+1)+'</div><h3>'+sub.n+'</h3><p>'+sub.d+'</p>'+arcHtml(sub.arc);
      card.classList.remove('swap'); },220);
    subnav.querySelectorAll('.subitem').forEach((x,j)=>x.classList.toggle('on',j===i));
  }
  subnav.querySelectorAll('.subitem').forEach(it=>it.addEventListener('click',()=>render(+it.dataset.i)));
  m._render=render; render(0);
});

// --- navigation ---
let cur='home';
function setTheme(m){ const d=m&&m.dome?m.dome:'207,210,192'; const a=m&&m.accent?m.accent:'#c79a5e';
  document.documentElement.style.setProperty('--dome',d); document.documentElement.style.setProperty('--accent',a); }
function go(id){ if(id===cur)return; const m=MODS.find(x=>x.id===id);
  document.getElementById('s-'+cur).classList.remove('on');
  document.getElementById('s-'+id).classList.add('on'); cur=id;
  document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('on',a.dataset.go===id));
  setTheme(id==='home'?null:m);
  document.getElementById('foot').textContent = id==='home' ? 'Future of the Data Center · past · present · future' : (m.eyebrow + (m.blank?'':' — select a topic'));
  if(m&&m._render)m._render(0);
  location.hash=id;
}
// init
document.getElementById('s-home').classList.add('on');
const h=(location.hash||'').replace('#',''); if(h&&MODS.find(x=>x.id===h))go(h);

// --- motes ---
const cv=document.getElementById('motes'),cx=cv.getContext('2d');let W,H,DPR=Math.min(devicePixelRatio||1,2);
function rs(){W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0);}addEventListener('resize',rs);rs();
const mo=[];for(let i=0;i<46;i++)mo.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2.1+.6,s:Math.random()*.15+.03,o:Math.random()*.28+.05,d:Math.random()*6.28});
function loop(t){cx.clearRect(0,0,W,H);cx.globalCompositeOperation='lighter';
  mo.forEach(p=>{p.y-=p.s;p.x+=Math.sin(t*.0004+p.d)*.13;if(p.y<-6){p.y=H+6;p.x=Math.random()*W;}
    const g=cx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*4);g.addColorStop(0,'rgba(233,235,218,'+p.o+')');g.addColorStop(1,'rgba(233,235,218,0)');
    cx.fillStyle=g;cx.beginPath();cx.arc(p.x,p.y,p.r*4,0,6.28);cx.fill();});
  requestAnimationFrame(loop);}requestAnimationFrame(loop);
addEventListener('keydown',e=>{const order=MODS.map(m=>m.id);const i=order.indexOf(cur);if(e.key==='ArrowRight'&&i<order.length-1)go(order[i+1]);if(e.key==='ArrowLeft'&&i>0)go(order[i-1]);});
</script>
</body>
</html>
