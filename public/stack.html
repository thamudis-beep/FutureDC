<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Future of the Data Center</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#090a0f; --bg2:#0c0e15;
    --ink:#e9ebf2; --ink-soft:#9297a8; --ink-dim:#5a6072;
    --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.055);
    --cream:#f2eee4; --cream-ink:#1b1e19; --cream-soft:#6c7266;
    --accent:#6f8dff; --glow:rgba(111,141,255,.42);
    --pre:#8b93a6; --today:#e0a355; --future:#57c7dd;
    --pwr:#e0a355; --cmp:#46c6dd; --dc:#6f8dff; --app:#ab7cf1;
    --serif:'Instrument Serif',Georgia,serif;
    --sans:'Instrument Sans',system-ui,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;font-family:var(--sans);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
  body{background:radial-gradient(60% 60% at 42% 44%, var(--glowbg,rgba(111,141,255,.10)), transparent 62%),radial-gradient(120% 120% at 50% -8%, rgba(255,255,255,.03), transparent 46%),var(--bg);transition:background 1s ease}
  #field{position:fixed;inset:0;z-index:1;pointer-events:none}
  .vig{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(120% 90% at 50% 42%, transparent 54%, rgba(0,0,0,.5))}

  .bar{position:fixed;top:0;left:0;right:0;height:58px;z-index:40;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(20px,4vw,52px)}
  .brand{display:flex;align-items:center;gap:10px;cursor:pointer}
  .brand .dia{width:9px;height:9px;background:var(--accent);transform:rotate(45deg);border-radius:1px;transition:background .6s}
  .brand b{font:600 12.5px var(--mono);letter-spacing:.02em}
  .topnav{position:relative;display:flex;align-items:center;padding:5px;border-radius:999px;
    background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));backdrop-filter:blur(16px);
    border:1px solid rgba(255,255,255,.1);box-shadow:0 12px 34px -14px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.08)}
  .topnav .slider{position:absolute;left:0;top:5px;bottom:5px;border-radius:999px;background:linear-gradient(180deg,#fff,#e7eaf1);
    box-shadow:0 4px 14px -4px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.7);transition:transform .42s cubic-bezier(.5,.05,.15,1),width .42s cubic-bezier(.5,.05,.15,1);z-index:0}
  .topnav a{position:relative;z-index:1;padding:8px 17px;border-radius:999px;font:500 12px var(--mono);letter-spacing:.03em;color:var(--ink-soft);cursor:pointer;transition:color .3s;white-space:nowrap}
  .topnav a.on{color:#0a0c12}
  .topnav a:not(.on):hover{color:var(--ink)}

  .view{position:fixed;inset:58px clamp(20px,4vw,52px) 26px;z-index:5;opacity:0;visibility:hidden;transform:translateY(12px);transition:opacity .5s ease,transform .5s cubic-bezier(.2,.7,.2,1);pointer-events:none;display:flex;flex-direction:column}
  .view.on{opacity:1;visibility:visible;transform:none;pointer-events:auto}
  .vtitle{flex:none;padding-top:clamp(4px,1.4vh,18px)}
  .eyebrow{font:500 11.5px var(--mono);letter-spacing:.2em;color:var(--accent);transition:color .5s;margin-bottom:10px}
  h1{font-family:var(--serif);font-weight:400;font-size:clamp(34px,4.8vw,58px);line-height:.98;letter-spacing:-.005em;margin:0}

  /* ===== HOME (big immersive) ===== */
  #v-home{justify-content:center}
  #v-home .hhead{flex:none}
  #v-home h1{font-size:clamp(46px,7.4vw,104px);line-height:.92;letter-spacing:-.015em}
  #v-home h1 .sub{display:block;font-style:italic;color:#cfd6ea;font-size:.62em;margin-top:.06em}
  #v-home .kick{font:500 12px var(--mono);letter-spacing:.28em;color:var(--accent);margin-bottom:20px;text-transform:uppercase}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:clamp(14px,1.6vw,22px);margin-top:clamp(18px,3vh,38px);max-width:660px}
  .hcard{position:relative;border-radius:20px;overflow:hidden;cursor:pointer;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.008));
    transition:transform .3s cubic-bezier(.2,.7,.2,1),border-color .3s,box-shadow .3s;box-shadow:0 30px 70px -40px rgba(0,0,0,.8)}
  .hcard:hover{transform:translateY(-6px);border-color:color-mix(in srgb,var(--ca) 60%,var(--line));box-shadow:0 46px 90px -40px rgba(0,0,0,.85),0 0 40px -20px var(--ca)}
  .hcard .pic{position:relative;height:clamp(100px,12.5vh,138px);overflow:hidden;background:radial-gradient(120% 120% at 50% 10%, color-mix(in srgb,var(--ca) 14%,#0b0d14), #0a0c12)}
  .hcard .pic::after{content:'';position:absolute;left:-20%;right:-20%;top:-45%;height:45%;background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--ca) 40%,transparent),transparent);animation:scan var(--sd,3.6s) cubic-bezier(.5,0,.5,1) infinite;pointer-events:none;mix-blend-mode:screen}
  @keyframes scan{0%{transform:translateY(0);opacity:0}12%{opacity:.9}48%{transform:translateY(560%);opacity:.9}62%{opacity:0}100%{transform:translateY(560%);opacity:0}}
  .hcard .meta{padding:12px 16px 14px}
  .hcard .no{font:600 10.5px var(--mono);letter-spacing:.16em;color:var(--ca)}
  .hcard h3{font-family:var(--serif);font-weight:400;font-size:clamp(21px,2.1vw,29px);line-height:1;margin:0;color:var(--ink)}
  .hcard .go{position:absolute;right:14px;bottom:13px;width:34px;height:34px;border-radius:50%;background:var(--ca);color:#0a0c12;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;transition:transform .25s}
  .hcard:hover .go{transform:translateX(4px)}
  .mini-shift,.mini-stack{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .mini-stack svg{width:58%;margin:-15px 0}

  /* ===== MATRIX (4 modules × time) ===== */
  #v-matrix .body{flex:1;min-height:0;display:flex;flex-direction:column;padding-top:clamp(28px,5vh,56px);overflow:hidden}
  .mtx{flex:1;min-height:0;display:grid;grid-template-columns:172px 1fr 1fr 1fr;overflow:auto;scrollbar-width:thin}
  .mtx::-webkit-scrollbar{height:7px;width:7px}.mtx::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:3px}
  .mhead{position:sticky;top:0;z-index:3;background:linear-gradient(180deg,var(--bg) 72%,transparent);padding:0 16px 12px;font:600 12px var(--mono);letter-spacing:.14em}
  .mhead .k{display:inline-block;padding-bottom:7px;border-bottom:2px solid transparent}
  .mhead.pre .k{color:var(--pre);border-color:var(--pre)}
  .mhead.today .k{color:var(--today);border-color:var(--today)}
  .mhead.future .k{color:var(--future);border-color:var(--future)}
  .rlabel{padding:16px 16px 16px 0;border-top:1px solid var(--line2);display:flex;align-items:center;gap:11px;cursor:pointer;transition:.2s}
  .rlabel:hover{background:rgba(255,255,255,.02)}
  .rlabel .mn{font:600 14px var(--mono);letter-spacing:.04em;color:var(--mc)}
  .rlabel .ms{font:400 9.5px var(--mono);color:var(--ink-dim);margin-top:3px}
  .cell{padding:15px 16px;border-top:1px solid var(--line2);border-left:1px solid var(--line2);display:flex;flex-direction:column}
  .cell.today{background:rgba(224,163,85,.045)}.cell.future{background:rgba(87,199,221,.05)}
  .ico{height:38px;display:flex;align-items:flex-end;gap:6px;margin-bottom:9px}
  .ico svg{overflow:visible;display:block}
  .ct{font:500 13.5px/1.22 var(--sans);color:var(--ink);margin-bottom:3px}
  .cd{font:400 11px/1.36 var(--mono);color:var(--ink-soft)}
  .in{display:inline-flex;opacity:0;animation:lu .5s ease forwards}
  @keyframes lu{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  .gi{animation:flt 4s ease-in-out infinite}@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  .spin{animation:spin 4s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
  .dash{stroke-dasharray:5 5;animation:flow 1.1s linear infinite}@keyframes flow{to{stroke-dashoffset:-20}}
  .grow{transform:scaleX(.12);transform-box:fill-box;transform-origin:left center;animation:grow .9s cubic-bezier(.2,.7,.2,1) .1s forwards}@keyframes grow{to{transform:scaleX(1)}}
  .rise{transform:scaleY(0);transform-box:fill-box;transform-origin:bottom;animation:rise 1s cubic-bezier(.2,.7,.2,1) .2s forwards}@keyframes rise{to{transform:scaleY(1)}}
  .strike{stroke-dasharray:1;stroke-dashoffset:1;animation:drw .5s ease .5s forwards}@keyframes drw{to{stroke-dashoffset:0}}

  /* ===== STACK (thin rail) ===== */
  #v-stack .body{flex:1;min-height:0;display:grid;grid-template-columns:236px 1fr;gap:clamp(26px,4vw,60px);align-items:center;padding:clamp(8px,1.6vh,18px) 0}
  .stack{display:flex;flex-direction:column;gap:clamp(5px,1.1vh,12px);justify-content:center}
  .row{display:grid;grid-template-columns:1fr 18px 118px;align-items:center;cursor:pointer}
  .lab{text-align:right}
  .lab .ln{font:600 12px var(--mono);letter-spacing:.05em;color:var(--ink-soft);transition:color .25s}
  .lab .lc{font:400 9.5px var(--mono);color:var(--ink-dim);margin-top:2px}
  .row.sel .lab .ln,.row:hover .lab .ln{color:var(--ink)}
  .conn{height:1px;background:var(--line);margin:0 5px;transition:.25s}
  .row.sel .conn{background:var(--acc);box-shadow:0 0 8px var(--glow)}
  .slab{display:block;width:100%;height:auto;filter:drop-shadow(0 8px 12px rgba(0,0,0,.55));transition:transform .3s cubic-bezier(.2,.7,.2,1),filter .4s}
  .slab .top{fill:#333c62;stroke:rgba(255,255,255,.14);stroke-width:1;transition:fill .4s}
  .slab .sideL{fill:#1a2036;transition:fill .4s}.slab .sideR{fill:#12172a;transition:fill .4s}
  .row:hover .slab{transform:translateY(-3px)}.row:hover .slab .top{fill:#3d4772}
  .row.sel .slab{transform:translateY(-4px) scale(1.02);filter:drop-shadow(0 8px 26px var(--glow));animation:breathe 3.4s ease-in-out infinite}
  .row.sel .slab .top{fill:var(--acc)}
  .row.sel .slab .sideL{fill:color-mix(in srgb,var(--acc) 52%,#0a0d18)}
  .row.sel .slab .sideR{fill:color-mix(in srgb,var(--acc) 34%,#080a12)}
  @keyframes breathe{0%,100%{filter:drop-shadow(0 8px 22px var(--glow))}50%{filter:drop-shadow(0 10px 36px var(--glow))}}
  .panel{border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.024),rgba(255,255,255,.006));padding:clamp(18px,2.2vw,28px);height:100%;max-height:100%;display:flex;flex-direction:column;min-height:0;box-shadow:0 30px 80px -40px rgba(0,0,0,.8);transition:opacity .32s ease,transform .32s cubic-bezier(.2,.7,.2,1)}
  .panel.swap{opacity:0;transform:translateY(8px)}
  .peyebrow{font:500 10.5px var(--mono);letter-spacing:.16em;color:var(--accent)}
  .ptitle{font-family:var(--serif);font-weight:400;font-size:clamp(28px,2.8vw,40px);line-height:1;margin:7px 0 10px}
  .pmeta{display:flex;align-items:center;gap:10px;margin:2px 0 14px}
  .pmeta .c{font:600 11px var(--mono);color:var(--accent);letter-spacing:.04em}
  .pmeta .bar-l{flex:1;height:1px;background:var(--line)}
  .boxes{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;overflow:auto;scrollbar-width:thin;padding-right:2px}
  .boxes::-webkit-scrollbar{width:6px}.boxes::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:3px}
  .box{border:1px solid var(--line2);background:rgba(255,255,255,.014);border-radius:12px;padding:12px 13px;transition:.18s;cursor:pointer;animation:pop .4s cubic-bezier(.2,.7,.2,1) both}
  .box:hover{border-color:color-mix(in srgb,var(--accent) 55%,transparent);background:rgba(255,255,255,.032);transform:translateY(-2px)}
  .box .bhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
  .bico{display:inline-flex;color:var(--accent)}.bico svg{display:block}
  .box .bi{font:600 10.5px var(--mono);color:var(--accent);letter-spacing:.05em}
  .box .bn{font:500 14px/1.18 var(--sans);margin:0 0 5px;color:var(--ink)}
  .box .bd{font:400 11.5px/1.42 var(--sans);color:var(--ink-soft)}
  .dhh{display:flex;align-items:center;gap:13px;margin:7px 0 14px}
  .bico.big{width:48px;height:48px;flex:none;border:1px solid var(--line);border-radius:13px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--accent) 9%,transparent)}
  .bico.big svg{width:30px;height:30px}
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .blankbox{grid-column:1/-1;border:1px dashed var(--line);border-radius:14px;padding:30px;text-align:center;color:var(--ink-soft)}
  .blankbox .t{font:500 12px var(--mono);letter-spacing:.14em;color:var(--accent);text-transform:uppercase}
  .blankbox p{font-size:13px;line-height:1.55;margin:12px auto 0;max-width:44ch}
  .dtop{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .back{font:500 11px var(--mono);letter-spacing:.04em;color:var(--ink-soft);cursor:pointer;padding:6px 11px;border:1px solid var(--line);border-radius:999px;transition:.18s;white-space:nowrap}
  .back:hover{color:var(--ink);border-color:rgba(255,255,255,.22)}
  .pills{display:flex;gap:5px;overflow:auto;scrollbar-width:none}.pills::-webkit-scrollbar{display:none}
  .pill{font:600 10.5px var(--mono);color:var(--ink-dim);border:1px solid var(--line2);border-radius:999px;padding:6px 10px;cursor:pointer;transition:.16s;white-space:nowrap}
  .pill:hover{color:var(--ink-soft);border-color:var(--line)}
  .pill.on{color:var(--bg);background:var(--accent);border-color:var(--accent)}
  .dbody{overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;padding-right:4px}
  .dbody::-webkit-scrollbar{width:6px}.dbody::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:3px}
  .dlead{font-size:15px;line-height:1.6;color:var(--ink);margin:2px 0 18px;max-width:64ch}
  .eras{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin:0 0 20px;max-width:820px}
  .erac{border:1px solid var(--line2);border-radius:12px;padding:12px 13px;background:rgba(255,255,255,.012);min-width:0}
  .erac .et{font:600 9.5px var(--mono);letter-spacing:.12em;margin-bottom:7px}
  .erac.pre .et{color:var(--pre)}.erac.today .et{color:var(--today)}.erac.future .et{color:var(--future)}
  .erac .ed{font:400 12px/1.42 var(--sans);color:var(--ink-soft)}
  .dpoints{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
  .dpoints li{position:relative;padding-left:20px;font-size:13.5px;line-height:1.5;color:var(--ink-soft)}
  .dpoints li::before{content:'';position:absolute;left:2px;top:7px;width:7px;height:7px;background:var(--accent);transform:rotate(45deg);border-radius:1px}
  .dpoints li b{color:var(--ink);font-weight:500}
  .dsec{font:600 10px var(--mono);letter-spacing:.16em;color:var(--ink-dim);margin:0 0 12px}

  .ver{position:fixed;right:clamp(20px,4vw,52px);bottom:12px;z-index:20;font:400 10px var(--mono);color:var(--ink-dim);letter-spacing:.06em}
  @media (max-width:900px){
    #v-home .cards,#v-stack .body{grid-template-columns:1fr;overflow:auto;align-items:start}
    .mtx{grid-template-columns:120px 1fr 1fr 1fr}
    .boxes{grid-template-columns:1fr 1fr}
    .topnav a{padding:7px 9px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="field"></canvas><div class="vig"></div>

<div class="bar">
  <div class="brand" data-nav="home"><span class="dia"></span><b>FUTURE&nbsp;OF&nbsp;THE&nbsp;DATA&nbsp;CENTER</b></div>
  <div class="topnav"><span class="slider" id="navSlider"></span><a data-nav="home">Home</a><a data-nav="matrix">The Shift</a><a data-nav="stack">The Stack</a></div>
</div>

<!-- HOME -->
<section class="view" id="v-home">
  <div class="hhead">
    <h1>Future of the<br>Data Center</h1>
  </div>
  <div class="cards">
    <div class="hcard" data-nav="matrix" style="--ca:var(--today);--sd:3.4s">
      <div class="pic"><div class="mini-shift" id="miniShift"></div></div>
      <div class="meta"><h3>The Shift</h3></div>
      <div class="go">→</div>
    </div>
    <div class="hcard" data-nav="stack" style="--ca:var(--accent);--sd:4.2s">
      <div class="pic"><div class="mini-stack" id="miniStack"></div></div>
      <div class="meta"><h3>The Stack</h3></div>
      <div class="go">→</div>
    </div>
  </div>
</section>

<!-- MATRIX -->
<section class="view" id="v-matrix">
  <div class="body"><div class="mtx" id="mtx"></div></div>
</section>

<!-- STACK -->
<section class="view" id="v-stack">
  <div class="body"><div class="stack" id="stack"></div><div class="panel" id="panel"></div></div>
</section>

<div class="ver">v7 · pixel bg</div>

<script>
const C_PRE='#8b93a6',C_TOD='#e0a355',C_FUT='#57c7dd';
const rgba=(hex,a)=>{const n=parseInt(hex.slice(1),16);return`rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;};

/* ============ GLYPHS ============ */
function reveal(items){return items.map((g,i)=>'<span class="in" style="animation-delay:'+(0.08+i*0.09)+'s">'+g+'</span>').join('');}
const globe=c=>'<svg class="gi" width="24" height="24" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="'+c+'" stroke-width="1.5"/><ellipse cx="12" cy="12" rx="4" ry="9" stroke="'+c+'" stroke-width="1"/><path d="M3 12h18M4.5 7h15M4.5 17h15" stroke="'+c+'" stroke-width=".9"/></svg>';
const chat=c=>'<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="13" rx="4" stroke="'+c+'" stroke-width="1.5"/><path d="M7 17l-1.5 3.5L10 17" stroke="'+c+'" stroke-width="1.5" fill="'+c+'" stroke-linejoin="round"/><circle cx="8" cy="10.5" r="1.1" fill="'+c+'"/><circle cx="12" cy="10.5" r="1.1" fill="'+c+'"/><circle cx="16" cy="10.5" r="1.1" fill="'+c+'"/></svg>';
const hex=c=>'<svg class="gi" width="21" height="23" viewBox="0 0 21 23" fill="none"><path d="M10.5 1l8.5 4.9v11L10.5 22 2 16.9v-11z" stroke="'+c+'" stroke-width="1.4"/><circle cx="10.5" cy="11.4" r="2.4" fill="'+c+'"/></svg>';
const robot=c=>'<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><rect x="4.5" y="8" width="15" height="11" rx="3" stroke="'+c+'" stroke-width="1.5"/><path d="M12 3v5" stroke="'+c+'" stroke-width="1.5"/><circle cx="12" cy="3" r="1.5" fill="'+c+'"/><circle cx="9.5" cy="13" r="1.5" fill="'+c+'"/><circle cx="14.5" cy="13" r="1.5" fill="'+c+'"/></svg>';
const chip=(L,c)=>'<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="2" y="2" width="14" height="14" rx="2.5" stroke="'+c+'" stroke-width="1.2" fill="'+c+'" fill-opacity=".14"/><text x="9" y="12.4" text-anchor="middle" font-family="var(--mono)" font-size="9" font-weight="600" fill="'+c+'">'+L+'</text></svg>';
const chips=list=>'<span style="display:inline-flex;gap:3px">'+list.map(x=>chip(x[0],x[1])).join('')+'</span>';
function net(c,mode){
  if(mode==='solid')return '<svg width="86" height="30" viewBox="0 0 86 30" fill="none"><rect x="3" y="9" width="12" height="12" rx="2.5" stroke="'+c+'" stroke-width="1.3"/><line x1="15" y1="15" x2="71" y2="15" stroke="'+c+'" stroke-width="1.5"/><rect x="71" y="9" width="12" height="12" rx="2.5" stroke="'+c+'" stroke-width="1.3"/></svg>';

function buildMatrix(){
  const m=document.getElementById('mtx');let h='';
  h+='<div class="mhead"></div><div class="mhead pre"><span class="k">PRE-AI</span></div><div class="mhead today"><span class="k">TODAY</span></div><div class="mhead future"><span class="k">FUTURE</span></div>';
  [...MODS].reverse().forEach(mo=>{
    h+='<div class="rlabel" data-go="'+mo.id+'" style="--mc:'+mo.c+'"><span style="width:9px;height:9px;background:'+mo.c+';transform:rotate(45deg);border-radius:1px;flex:none"></span><div class="mn">'+mo.n+'</div></div>';
    ['pre','today','future'].forEach(k=>{const c=mo[k];h+='<div class="cell '+k+'"><div class="ico">'+c.i+'</div><div class="ct">'+c.t+'</div><div class="cd">'+c.d+'</div></div>';});
  });
  m.innerHTML=h;
  m.querySelectorAll('.rlabel[data-go]').forEach(r=>r.addEventListener('click',()=>go('stack',r.dataset.go)));
}

   {n:'Space',d:'Off-planet data centers: free power, passive cooling, no permits.',lead:'Orbit is a geography of its own: unlimited sun, passive radiative cooling, and no permitting regime — at the cost of launch mass and servicing.',era:['N/A — terrestrial only','Concepts + early demonstrators','Orbital compute for select workloads'],points:['Free 24/7 solar and passive radiative cooling.','No land, water or permitting constraints.','Launch cost, radiation and servicing are the hurdles.']},
  ]},
 {id:'apps',name:'APPLICATIONS',title:'Applications',accent:'#ab7cf1',eyebrow:'LAYER 04 · THE WORK ON TOP',blank:true,subs:[]},
];
const SLAB='<svg class="slab" viewBox="0 0 300 124" preserveAspectRatio="xMidYMid meet"><polygon class="sideL" points="12,52 150,92 150,120 12,80"/><polygon class="sideR" points="288,52 150,92 150,120 288,80"/><polygon class="top" points="12,52 150,12 288,52 150,92"/></svg>';

/* ============ HOME previews ============ */
(function(){
  const cols=['#ab7cf1','#6f8dff','#46c6dd','#e0a355'];
  document.getElementById('miniStack').innerHTML=cols.map(c=>'<svg viewBox="0 0 300 124" style="filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))"><polygon points="12,52 150,92 150,120 12,80" fill="'+rgba(c,.55)+'"/><polygon points="288,52 150,92 150,120 288,80" fill="'+rgba(c,.38)+'"/><polygon points="12,52 150,12 288,52 150,92" fill="'+c+'" stroke="rgba(255,255,255,.2)"/></svg>').join('');
  // mini shift: 4 module rows, each an icon + 3 growing era blocks (previews the 4-part matrix)
  const mods=[['#ab7cf1','APP','globe'],['#6f8dff','DC','buildings'],['#46c6dd','CMP','chip'],['#e0a355','PWR','reactor']];
  let h='<div style="display:grid;grid-template-columns:17px 26px 1fr 1fr 1fr;gap:5px 7px;width:82%;align-items:center;padding:2px 0">';

  mods.forEach(mo=>{h+='<span style="color:'+mo[0]+';display:flex;transform:scale(.62);transform-origin:left center">'+G[mo[2]](mo[0])+'</span>';
    h+='<div style="font:600 7.5px var(--mono);color:'+mo[0]+'">'+mo[1]+'</div>';
    [.34,.62,1].forEach(op=>h+='<div style="height:8px;border-radius:2px;background:'+mo[0]+';opacity:'+op+'"></div>');});
  h+='</div>';
  document.getElementById('miniShift').innerHTML=h;
})();

/* ============ STACK build ============ */
const stackEl=document.getElementById('stack');
[...LAYERS].reverse().forEach(L=>{
  const row=document.createElement('div');row.className='row';row.dataset.id=L.id;
  row.style.setProperty('--acc',L.accent);row.style.setProperty('--glow',rgba(L.accent,.42));
  row.innerHTML='<div class="lab"><div class="ln">'+L.name+'</div><div class="lc">'+(L.blank?'—':L.subs.length+' topics')+'</div></div><div class="conn"></div><div class="slabwrap">'+SLAB+'</div>';
  row.addEventListener('click',()=>go('stack',L.id));stackEl.appendChild(row);
});
const panel=document.getElementById('panel');
function themeFor(L){const a=L?L.accent:'#6f8dff';document.documentElement.style.setProperty('--accent',a);document.documentElement.style.setProperty('--glow',rgba(a,.42));document.documentElement.style.setProperty('--glowbg',rgba(a,.11));}
function markLayer(id){document.querySelectorAll('.row').forEach(r=>r.classList.toggle('sel',r.dataset.id===id));}
function renderLayer(L){markLayer(L.id);themeFor(L);
  let boxes=L.blank?'<div class="blankbox"><div class="t">In progress</div></div>'
    :L.subs.map((s,i)=>'<div class="box" data-i="'+i+'" style="animation-delay:'+(i*40)+'ms"><div class="bhead"><span class="bico">'+topicIcon(L.id,i,L.accent)+'</span><span class="bi">'+String(i+1).padStart(2,'0')+'</span></div><div class="bn">'+s.n+'</div><div class="bd">'+s.d+'</div></div>').join('');
  panel.innerHTML='<div class="ptitle">'+L.title+'</div><div class="pmeta"><span class="bar-l"></span></div><div class="boxes">'+boxes+'</div>';
  panel.querySelectorAll('.box[data-i]').forEach(b=>b.addEventListener('click',()=>go('stack',L.id,+b.dataset.i)));}
function renderTopic(L,i){markLayer(L.id);themeFor(L);
  const s=L.subs[i];const pills=L.subs.map((x,j)=>'<div class="pill'+(j===i?' on':'')+'" data-i="'+j+'">'+String(j+1).padStart(2,'0')+'&nbsp;'+x.n+'</div>').join('');
  const eras=s.era?('<div class="eras"><div class="erac pre"><div class="et">PRE-AI</div><div class="ed">'+s.era[0]+'</div></div><div class="erac today"><div class="et">TODAY</div><div class="ed">'+s.era[1]+'</div></div><div class="erac future"><div class="et">FUTURE</div><div class="ed">'+s.era[2]+'</div></div></div>'):'';
  const pts=s.points?('<ul class="dpoints">'+s.points.map(p=>'<li>'+p+'</li>').join('')+'</ul>'):'';
  panel.innerHTML='<div class="dtop"><div class="back" id="backBtn">‹ '+L.title+'</div><div class="pills">'+pills+'</div></div><div class="dhh"><span class="bico big">'+topicIcon(L.id,i,L.accent)+'</span><div class="ptitle" style="margin:0">'+s.n+'</div></div><div class="dbody"><p class="dlead">'+s.lead+'</p>'+eras+pts+'</div>';
  panel.querySelector('#backBtn').addEventListener('click',()=>go('stack',L.id));
  panel.querySelectorAll('.pill').forEach(p=>p.addEventListener('click',()=>go('stack',L.id,+p.dataset.i)));}

/* ============ ROUTER ============ */
let cur={view:null};
function moveSlider(){const a=document.querySelector('.topnav a.on'),s=document.getElementById('navSlider');if(!a||!s)return;s.style.width=a.offsetWidth+'px';s.style.transform='translateX('+a.offsetLeft+'px)';}
addEventListener('resize',moveSlider);addEventListener('load',moveSlider);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(moveSlider);setTimeout(moveSlider,350);
function setView(v){document.querySelectorAll('.view').forEach(s=>s.classList.toggle('on',s.id==='v-'+v));document.querySelectorAll('.topnav a').forEach(a=>a.classList.toggle('on',a.dataset.nav===v));moveSlider();if(v==='home'||v==='matrix')themeFor(null);document.getElementById('field').style.opacity=(v==='home')?'1':'.42';}
function go(view,layer,topic){const same=cur.view===view&&cur.layer===layer&&cur.topic===topic;if(same)return;setView(view);
  if(view==='matrix')buildMatrix();
  if(view==='stack'){const L=LAYERS.find(x=>x.id===layer)||LAYERS[0];const wasStack=cur.view==='stack';const doRender=()=>{(topic!=null&&!L.blank)?renderTopic(L,topic):renderLayer(L);};
    if(wasStack){panel.classList.add('swap');setTimeout(()=>{doRender();panel.classList.remove('swap');},190);}else doRender();
    cur={view,layer:L.id,topic:(topic!=null&&!L.blank)?topic:undefined};location.hash='stack/'+L.id+(cur.topic!=null?'/'+cur.topic:'');
  }else{cur={view};location.hash=view==='home'?'':view;}}
document.querySelectorAll('[data-nav]').forEach(el=>el.addEventListener('click',()=>go(el.dataset.nav)));
function fromHash(){const p=(location.hash||'').replace('#','').split('/').filter(Boolean);
  if(!p.length||p[0]==='home')return go('home');if(p[0]==='matrix')return go('matrix');
  if(p[0]==='stack'){const id=p[1]&&LAYERS.find(x=>x.id===p[1])?p[1]:'power';const t=p[2]!=null?+p[2]:undefined;return go('stack',id,t);}go('home');}
addEventListener('hashchange',fromHash);fromHash();
addEventListener('keydown',e=>{if(cur.view!=='stack')return;const vis=[...LAYERS].reverse().map(l=>l.id);const i=vis.indexOf(cur.layer);
  if(e.key==='ArrowDown'&&i<vis.length-1)go('stack',vis[i+1]);if(e.key==='ArrowUp'&&i>0)go('stack',vis[i-1]);if(e.key==='Escape'&&cur.topic!=null)go('stack',cur.layer);});

/* ============ FIELD: animated pixel-video background ============ */
(function(){
  const cv=document.getElementById('field'),x=cv.getContext('2d');
  let W,H,DPR=Math.min(devicePixelRatio||1,2),CELL=22,COLS,ROWS;
  const ptr={x:-9999,y:-9999};
  function rs(){W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;x.setTransform(DPR,0,0,DPR,0,0);COLS=Math.ceil(W/CELL)+1;ROWS=Math.ceil(H/CELL)+1;}
  addEventListener('resize',rs);rs();
  addEventListener('mousemove',e=>{ptr.x=e.clientX;ptr.y=e.clientY;});
  addEventListener('mouseout',()=>{ptr.x=ptr.y=-9999;});
  function loop(t){
    x.clearRect(0,0,W,H);
    const acc=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#6f8dff';
    const n=parseInt(acc.slice(1),16),R=n>>16&255,Gc=n>>8&255,B=n&255,tt=t*0.001,s=CELL-3;
    const cx=COLS*0.5,cy=ROWS*0.62;
    for(let j=0;j<ROWS;j++){const py=j*CELL;
      for(let i=0;i<COLS;i++){const px=i*CELL;
        let v=Math.sin(i*0.34+tt*1.05)+Math.sin(j*0.30-tt*0.9)+Math.sin((i+j)*0.20+tt*0.65)+Math.sin(Math.hypot(i-cx,j-cy)*0.42-tt*1.25);
        v=(v+4)/8;
        if(ptr.x>-9000){const d=Math.hypot(px-ptr.x,py-ptr.y),r=1-Math.min(1,d/230);if(r>0)v+=r*0.7*(0.55+0.45*Math.sin(d*0.05-tt*4));}
        v=v<0?0:v>1?1:v;
        const a=v*v*v*0.55;
        if(a<0.012)continue;
        x.fillStyle='rgba('+R+','+Gc+','+B+','+a.toFixed(3)+')';
        x.fillRect(px,py,s,s);
      }
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
