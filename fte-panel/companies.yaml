# Sample definition for the tech-sector productivity-per-FTE panel.
#
# One entry per firm. Fields:
#   ticker      exchange ticker (ADRs use the US ticker)
#   cik         SEC Central Index Key, 10 digits, zero padded. Every CIK here is
#               VALIDATED at run time against https://www.sec.gov/files/company_tickers.json
#               by `make ciks`; a mismatch aborts the pipeline and prints the SEC value.
#   fye_month   month in which the fiscal year ends (1-12); checked against the
#               observed period-end dates in the XBRL facts and flagged if different.
#   cohort      one of hyperscaler | internet | software | semis | itservices | nontech
#   form        annual report form the firm files (10-K, 20-F or 40-F). 20-F/40-F filers
#               are foreign private issuers: IFRS tags, Item 6.D "Employees", possibly
#               non-USD reporting currency. See DATA_QUALITY.md.
#   pilot       true for the five firms the pipeline is validated on first
#   layoffs_names  names used for the company on layoffs.fyi (matching is exact, case-insensitive)
#   notes       anything the analyst should know
#
# Non-tech control: 20 large-cap S&P 500 firms, listed explicitly, spanning staples,
# industrials, healthcare and financials. Banks (JPM, BAC, WFC, GS) have no GrossProfit /
# CostOfRevenue concept in US GAAP; those metrics are NA for them by construction.

firms:
  # ---- hyperscalers ---------------------------------------------------------
  - {ticker: MSFT,  cik: "0000789019", fye_month: 6,  cohort: hyperscaler, form: 10-K, layoffs_names: [Microsoft]}
  - {ticker: AMZN,  cik: "0001018724", fye_month: 12, cohort: hyperscaler, form: 10-K, layoffs_names: [Amazon],
     notes: "Discloses full-time AND part-time employees in one figure; headcount parser flags this."}
